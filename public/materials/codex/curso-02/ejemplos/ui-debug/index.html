<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab UI Debug</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="panel">
      <p class="kicker">Codex Lab</p>
      <h1>Checklist de despliegue</h1>
      <p>Revisa tests, variables, migraciones, rollback, owner y ventana de soporte antes de desplegar.</p>
      <ul>
        <li>Tests relevantes ejecutados</li>
        <li>Migraciones revisadas</li>
        <li>Rollback preparado</li>
        <li>Owner disponible</li>
      </ul>
    </main>
    <nav class="actions" aria-label="acciones">
      <button>Cancelar</button>
      <button class="primary">Aprobar</button>
    </nav>
  </body>
</html>
