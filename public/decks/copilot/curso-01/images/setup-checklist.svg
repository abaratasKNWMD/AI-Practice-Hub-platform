<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Copilot setup checklist</title>
  <desc id="desc">A setup checklist for account, license, editor, extension, settings and verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:800 20px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:600 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Primeros pasos: checklist antes de clase</text>
  <text x="72" y="122" class="small">La formacion practica empieza cuando nadie esta bloqueado por cuenta, extension o permisos.</text>

  <g transform="translate(160 170)">
    <rect width="880" height="460" rx="30" class="card"/>
    <rect x="0" y="0" width="880" height="58" rx="30" fill="#ffffff" fill-opacity=".08"/>
    <circle cx="34" cy="30" r="8" fill="#ff6b83"/>
    <circle cx="62" cy="30" r="8" fill="#f8c96a"/>
    <circle cx="90" cy="30" r="8" fill="#62e6a2"/>
    <text x="124" y="37" class="small">setup.copilot.local</text>
    <g transform="translate(72 100)">
      <circle cx="18" cy="18" r="14" fill="#62e6a2"/><path d="M10 18l6 7 12-15" fill="none" stroke="#061b18" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="24" class="label">Cuenta GitHub correcta</text>
      <circle cx="18" cy="82" r="14" fill="#62e6a2"/><path d="M10 82l6 7 12-15" fill="none" stroke="#061b18" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="88" class="label">Licencia o plan habilitado</text>
      <circle cx="18" cy="146" r="14" fill="#62e6a2"/><path d="M10 146l6 7 12-15" fill="none" stroke="#061b18" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="152" class="label">VS Code actualizado</text>
      <circle cx="18" cy="210" r="14" fill="#62e6a2"/><path d="M10 210l6 7 12-15" fill="none" stroke="#061b18" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="216" class="label">Extension instalada</text>
      <circle cx="18" cy="274" r="14" fill="#5ddcff"/><text x="54" y="280" class="label">settings.json revisado</text>
    </g>
    <g transform="translate(560 120)">
      <rect width="240" height="214" rx="22" fill="#07101e" stroke="#5ddcff" stroke-opacity=".24"/>
      <text x="24" y="42" class="mono">"github.copilot": {</text>
      <text x="24" y="80" class="mono">  "enable": true,</text>
      <text x="24" y="118" class="mono">  "review": true</text>
      <text x="24" y="156" class="mono">}</text>
    </g>
  </g>
</svg>
