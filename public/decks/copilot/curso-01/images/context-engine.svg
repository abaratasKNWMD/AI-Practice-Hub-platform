<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Prompting and context engineering</title>
  <desc id="desc">Prompt instructions and workspace context flow into a context engine and produce a better answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="1" stop-color="#071a18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#5ddcff"/>
      <stop offset="1" stop-color="#62e6a2"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:800 19px Inter,Segoe UI,sans-serif;fill:#eaf3ff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:600 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
      .blue{stroke:#5ddcff}
      .green{stroke:#62e6a2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#77e6d0"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="86" class="title">Prompting + Context Engineering</text>
  <text x="72" y="119" class="small">No gana quien pregunta mas fuerte. Gana quien prepara mejor la informacion.</text>

  <g transform="translate(72 172)">
    <rect width="300" height="410" rx="26" class="card"/>
    <text x="28" y="44" class="label">Prompt claro</text>
    <g transform="translate(28 78)">
      <rect width="244" height="70" rx="16" fill="#5ddcff" fill-opacity=".12" stroke="#5ddcff" stroke-opacity=".34"/>
      <text x="18" y="30" class="mono">Objetivo</text>
      <text x="18" y="54" class="small">Que debe cambiar</text>
    </g>
    <g transform="translate(28 168)">
      <rect width="244" height="70" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="18" y="30" class="mono">Restricciones</text>
      <text x="18" y="54" class="small">APIs, estilo, limites</text>
    </g>
    <g transform="translate(28 258)">
      <rect width="244" height="92" rx="16" fill="#62e6a2" fill-opacity=".10" stroke="#62e6a2" stroke-opacity=".32"/>
      <text x="18" y="30" class="mono">Done when</text>
      <text x="18" y="58" class="small">Diff revisado</text>
      <text x="18" y="78" class="small">Tests ejecutados</text>
    </g>
  </g>

  <g transform="translate(826 172)">
    <rect width="300" height="410" rx="26" class="card"/>
    <text x="28" y="44" class="label">Contexto util</text>
    <g transform="translate(32 84)">
      <path d="M18 0V236" stroke="#5ddcff" stroke-opacity=".32" stroke-width="3"/>
      <circle cx="18" cy="18" r="10" fill="#5ddcff"/>
      <text x="46" y="24" class="mono">src/cart.ts</text>
      <circle cx="18" cy="82" r="10" fill="#62e6a2"/>
      <text x="46" y="88" class="mono">tests/cart.spec.ts</text>
      <circle cx="18" cy="146" r="10" fill="#f8c96a"/>
      <text x="46" y="152" class="mono">README.md</text>
      <circle cx="18" cy="210" r="10" fill="#ff8fab"/>
      <text x="46" y="216" class="mono">rules.md</text>
    </g>
    <text x="34" y="360" class="small">Archivos abiertos, instrucciones y tests cambian la respuesta.</text>
  </g>

  <path d="M390 366H506" stroke="#77e6d0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M810 366H694" stroke="#77e6d0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(468 212)">
    <rect width="264" height="260" rx="34" fill="#ffffff" fill-opacity=".08" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="132" cy="114" r="74" fill="none" stroke="#5ddcff" stroke-opacity=".32" stroke-width="16"/>
    <circle cx="132" cy="114" r="46" fill="#62e6a2" fill-opacity=".18" stroke="#62e6a2" stroke-opacity=".46"/>
    <text x="68" y="122" class="label">ENGINE</text>
    <text x="36" y="210" class="small">Selecciona, comprime</text>
    <text x="36" y="234" class="small">y prioriza contexto.</text>
  </g>

  <g transform="translate(420 604)">
    <rect width="360" height="82" rx="24" fill="#62e6a2" fill-opacity=".13" stroke="#62e6a2" stroke-opacity=".42"/>
    <text x="30" y="36" class="label">Respuesta mejor</text>
    <text x="30" y="62" class="small">Menos vueltas, mas criterio, menos sorpresa.</text>
  </g>
</svg>
