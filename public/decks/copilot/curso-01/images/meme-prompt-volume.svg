<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Prompt volume versus context</title>
  <desc id="desc">A humorous comparison showing that louder prompts do not beat precise context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="1" stop-color="#071f1b"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:900 22px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:750 18px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Subir el volumen no anade contexto</text>
  <text x="72" y="122" class="small">Cuando Copilot responde mal, no hace falta gritar: hace falta orientar.</text>
  <g transform="translate(92 184)">
    <rect width="470" height="402" rx="32" class="card"/>
    <text x="38" y="60" class="label">Prompt con altavoz</text>
    <g transform="translate(58 110)">
      <rect width="354" height="86" rx="24" fill="#ff8fab" fill-opacity=".13" stroke="#ff8fab" stroke-opacity=".4"/>
      <text x="28" y="54" class="mono">ARREGLALO BIEN!!!</text>
      <rect y="130" width="354" height="110" rx="24" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="28" y="174" class="small">Copilot recibe energia...</text>
      <text x="28" y="206" class="small">pero no recibe criterios.</text>
    </g>
  </g>
  <g transform="translate(638 184)">
    <rect width="470" height="402" rx="32" class="card"/>
    <text x="38" y="60" class="label">Prompt con coordenadas</text>
    <g transform="translate(58 110)">
      <rect width="354" height="56" rx="18" fill="#5ddcff" fill-opacity=".13" stroke="#5ddcff" stroke-opacity=".36"/>
      <text x="24" y="36" class="mono">Objetivo</text>
      <rect y="76" width="354" height="56" rx="18" fill="#62e6a2" fill-opacity=".13" stroke="#62e6a2" stroke-opacity=".36"/>
      <text x="24" y="112" class="mono">Archivo + test</text>
      <rect y="152" width="354" height="56" rx="18" fill="#f8c96a" fill-opacity=".13" stroke="#f8c96a" stroke-opacity=".36"/>
      <text x="24" y="188" class="mono">Restriccion</text>
      <rect y="228" width="354" height="56" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="24" y="264" class="mono">Done when</text>
    </g>
  </g>
</svg>
