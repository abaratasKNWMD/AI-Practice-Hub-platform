<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Workspace context map</title>
  <desc id="desc">A repository map showing opened files, tests and instructions forming useful context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10182d"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#5ddcff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#62e6a2" stop-opacity=".2"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:800 19px Inter,Segoe UI,sans-serif;fill:#eaf3ff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:600 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Workspace context: Copilot no adivina, lee senales</text>
  <text x="72" y="122" class="small">Abrir archivos relevantes cambia mucho mas que repetir el prompt tres veces.</text>

  <g transform="translate(82 174)">
    <rect width="336" height="454" rx="26" class="card"/>
    <text x="28" y="46" class="label">Repo visible</text>
    <g transform="translate(34 86)">
      <text class="mono" x="0" y="0">app/</text>
      <text class="mono" x="28" y="42">checkout.ts</text>
      <text class="mono" x="28" y="84">cart.ts</text>
      <text class="mono" x="28" y="126">pricing.ts</text>
      <text class="mono" x="0" y="190">tests/</text>
      <text class="mono" x="28" y="232">checkout.spec.ts</text>
      <text class="mono" x="0" y="296">docs/</text>
      <text class="mono" x="28" y="338">billing-rules.md</text>
    </g>
  </g>

  <path d="M428 372C540 278 660 278 772 372C660 466 540 466 428 372Z" fill="url(#beam)" opacity=".35"/>
  <circle cx="600" cy="372" r="118" fill="#5ddcff" fill-opacity=".10" stroke="#5ddcff" stroke-opacity=".34" stroke-width="3"/>
  <circle cx="600" cy="372" r="72" fill="#62e6a2" fill-opacity=".12" stroke="#62e6a2" stroke-opacity=".42" stroke-width="3"/>
  <text x="540" y="360" class="label">Indice</text>
  <text x="523" y="392" class="small">+ archivos abiertos</text>

  <g transform="translate(786 174)">
    <rect width="332" height="454" rx="26" class="card"/>
    <text x="28" y="46" class="label">Contexto para la tarea</text>
    <g transform="translate(28 88)">
      <rect width="276" height="58" rx="16" fill="#5ddcff" fill-opacity=".13" stroke="#5ddcff" stroke-opacity=".36"/>
      <text x="18" y="36" class="mono">checkout.ts</text>
      <rect y="78" width="276" height="58" rx="16" fill="#62e6a2" fill-opacity=".13" stroke="#62e6a2" stroke-opacity=".36"/>
      <text x="18" y="114" class="mono">checkout.spec.ts</text>
      <rect y="156" width="276" height="58" rx="16" fill="#f8c96a" fill-opacity=".13" stroke="#f8c96a" stroke-opacity=".36"/>
      <text x="18" y="192" class="mono">billing-rules.md</text>
      <rect y="234" width="276" height="58" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="18" y="270" class="mono">copilot-instructions.md</text>
    </g>
    <text x="28" y="400" class="small">Mas contexto correcto, menos respuestas decorativas.</text>
  </g>
</svg>
