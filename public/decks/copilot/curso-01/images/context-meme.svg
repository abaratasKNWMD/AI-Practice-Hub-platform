<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Do not ask louder, add context</title>
  <desc id="desc">A playful split panel showing that asking louder is worse than adding context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#071a18"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:900 22px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 16px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:700 18px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Mini meme serio: no grites el prompt</text>
  <text x="72" y="122" class="small">Cuando Copilot falla, la primera sospecha suele ser el contexto.</text>

  <g transform="translate(86 180)">
    <rect width="486" height="420" rx="30" class="card" stroke="#ff8fab" stroke-opacity=".28"/>
    <text x="38" y="60" class="label">Iteracion pobre</text>
    <rect x="42" y="100" width="400" height="82" rx="22" fill="#ff8fab" fill-opacity=".12" stroke="#ff8fab" stroke-opacity=".36"/>
    <text x="66" y="148" class="mono">HAZLO BIEN!!!</text>
    <rect x="42" y="220" width="400" height="116" rx="22" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="66" y="262" class="mono">Copilot:</text>
    <text x="66" y="300" class="small">Tengo entusiasmo,</text>
    <text x="66" y="326" class="small">pero no informacion.</text>
  </g>

  <g transform="translate(628 180)">
    <rect width="486" height="420" rx="30" class="card" stroke="#62e6a2" stroke-opacity=".3"/>
    <text x="38" y="60" class="label">Iteracion madura</text>
    <rect x="42" y="100" width="400" height="146" rx="22" fill="#62e6a2" fill-opacity=".12" stroke="#62e6a2" stroke-opacity=".36"/>
    <text x="66" y="142" class="mono">Objetivo + archivo</text>
    <text x="66" y="180" class="mono">+ test + criterio</text>
    <text x="66" y="218" class="mono">+ limite</text>
    <rect x="42" y="284" width="400" height="72" rx="22" fill="#5ddcff" fill-opacity=".12" stroke="#5ddcff" stroke-opacity=".36"/>
    <text x="66" y="328" class="small">Resultado: menos drama, mas diff revisable.</text>
  </g>
</svg>
