<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Model overkill</title>
  <desc id="desc">A model choice joke about using a powerful model for a tiny task.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 22px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">No uses el modelo mas caro para renombrar una variable</text>
  <text x="72" y="122" class="small">Modelo correcto significa suficiente profundidad, latencia razonable y coste consciente.</text>
  <g transform="translate(102 188)">
    <rect width="448" height="394" rx="32" class="card"/>
    <text x="38" y="60" class="label">Tarea pequena</text>
    <rect x="54" y="108" width="340" height="92" rx="24" fill="#5ddcff" fill-opacity=".13" stroke="#5ddcff" stroke-opacity=".36"/>
    <text x="82" y="164" class="mono">rename tmp to userName</text>
    <rect x="54" y="240" width="340" height="70" rx="22" fill="#62e6a2" fill-opacity=".13" stroke="#62e6a2" stroke-opacity=".36"/>
    <text x="82" y="284" class="mono">modelo rapido: OK</text>
  </g>
  <g transform="translate(650 188)">
    <rect width="448" height="394" rx="32" class="card"/>
    <text x="38" y="60" class="label">Tarea profunda</text>
    <rect x="54" y="108" width="340" height="114" rx="24" fill="#f8c96a" fill-opacity=".13" stroke="#f8c96a" stroke-opacity=".36"/>
    <text x="82" y="154" class="mono">refactor billing flow</text>
    <text x="82" y="190" class="mono">with edge cases</text>
    <rect x="54" y="260" width="340" height="70" rx="22" fill="#ff8fab" fill-opacity=".12" stroke="#ff8fab" stroke-opacity=".36"/>
    <text x="82" y="304" class="mono">modelo profundo: razonable</text>
  </g>
</svg>
