<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Copilot Core cockpit</title>
  <desc id="desc">A Copilot cockpit with context, mode, review and cost controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#061b18"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#5ddcff"/>
      <stop offset="1" stop-color="#62e6a2"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.36 0 0 0 0 0.86 0 0 0 0 1 0 0 0 0.6 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label{font:800 24px Inter,Segoe UI,sans-serif;fill:#f7fbff}
      .small{font:700 16px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .tiny{font:800 13px Inter,Segoe UI,sans-serif;fill:#7fdfff;letter-spacing:.08em}
      .mono{font:600 18px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .muted{fill:#8f9daf}
      .line{stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <g opacity="0.22">
    <path d="M40 150H1160M40 300H1160M40 450H1160M40 600H1160" class="line"/>
    <path d="M170 48V710M340 48V710M510 48V710M680 48V710M850 48V710M1020 48V710" class="line"/>
  </g>
  <circle cx="248" cy="164" r="150" fill="#5ddcff" opacity=".16" filter="url(#glow)"/>
  <circle cx="974" cy="585" r="170" fill="#62e6a2" opacity=".14" filter="url(#glow)"/>

  <text x="70" y="92" class="tiny">GITHUB COPILOT CORE</text>
  <text x="70" y="135" class="label" font-size="38">La cabina antes de acelerar</text>
  <text x="72" y="166" class="small">Contexto, modo, permisos y coste en una sola decision.</text>

  <g transform="translate(332 178)">
    <rect width="540" height="360" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".18"/>
    <rect x="22" y="22" width="496" height="44" rx="16" fill="#0b1220" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="46" cy="44" r="7" fill="#ff6b83"/>
    <circle cx="72" cy="44" r="7" fill="#f8c96a"/>
    <circle cx="98" cy="44" r="7" fill="#62e6a2"/>
    <text x="130" y="50" class="small">vscode / copilot.chat</text>
    <rect x="38" y="92" width="464" height="224" rx="18" fill="#07101e" stroke="#5ddcff" stroke-opacity=".18"/>
    <text x="68" y="136" class="mono">task: refactor checkout()</text>
    <text x="68" y="176" class="mono muted">context: tests + cart service</text>
    <text x="68" y="216" class="mono">mode: Ask -> Edit -> Review</text>
    <text x="68" y="256" class="mono muted">done: diff + tests + owner check</text>
    <path d="M72 292H442" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(82 246)">
    <rect width="180" height="300" rx="26" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="26" y="44" class="tiny">MODO</text>
    <g transform="translate(24 72)">
      <rect width="132" height="50" rx="16" fill="#5ddcff" fill-opacity=".14" stroke="#5ddcff" stroke-opacity=".42"/>
      <text x="31" y="32" class="small" fill="#e8fbff">ASK</text>
    </g>
    <g transform="translate(24 142)">
      <rect width="132" height="50" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="31" y="32" class="small">EDIT</text>
    </g>
    <g transform="translate(24 212)">
      <rect width="132" height="50" rx="16" fill="#62e6a2" fill-opacity=".12" stroke="#62e6a2" stroke-opacity=".38"/>
      <text x="24" y="32" class="small" fill="#e9fff4">AGENT</text>
    </g>
  </g>

  <g transform="translate(930 238)">
    <rect width="210" height="316" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="30" y="46" class="tiny">COSTE</text>
    <path d="M52 188a68 68 0 0 1 136 0" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="18" stroke-linecap="round"/>
    <path d="M52 188a68 68 0 0 1 96-62" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="120" cy="188" r="8" fill="#f7fbff"/>
    <path d="M120 188L158 143" stroke="#f7fbff" stroke-width="5" stroke-linecap="round"/>
    <text x="44" y="235" class="label" font-size="22">Premium</text>
    <text x="44" y="264" class="small">requests bajo control</text>
  </g>

  <g transform="translate(150 620)">
    <rect width="900" height="68" rx="24" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="42" y="43" class="small">1. Contexto</text>
    <path d="M210 34H310" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <text x="336" y="43" class="small">2. Modo</text>
    <path d="M488 34H588" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <text x="614" y="43" class="small">3. Revision</text>
    <path d="M792 34H842" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <text x="858" y="43" class="small">4. Coste</text>
  </g>
</svg>
