<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Premium requests are not confetti</title>
  <desc id="desc">A humorous cost meter showing premium requests as budget tokens rather than confetti.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="1" stop-color="#071a18"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" x2="1">
      <stop offset="0" stop-color="#62e6a2"/>
      <stop offset=".55" stop-color="#f8c96a"/>
      <stop offset="1" stop-color="#ff8fab"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 22px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Premium requests no son confeti</text>
  <text x="72" y="122" class="small">El objetivo no es gastar menos siempre: es gastar donde el modelo caro cambia el resultado.</text>
  <g transform="translate(132 182)">
    <rect width="936" height="416" rx="34" class="card"/>
    <g transform="translate(82 76)">
      <rect width="772" height="46" rx="23" fill="#ffffff" fill-opacity=".1"/>
      <rect width="548" height="46" rx="23" fill="url(#meter)"/>
      <text x="0" y="96" class="mono">Ask simple: modelo rapido</text>
      <text x="0" y="138" class="mono">Refactor complejo: premium con razon</text>
      <text x="0" y="180" class="mono">Reintento sin cambiar contexto: sospechoso</text>
    </g>
    <g transform="translate(730 190)">
      <circle cx="0" cy="0" r="18" fill="#62e6a2"/>
      <circle cx="58" cy="-36" r="18" fill="#f8c96a"/>
      <circle cx="116" cy="8" r="18" fill="#ff8fab"/>
      <circle cx="38" cy="62" r="18" fill="#5ddcff"/>
      <text x="-72" y="136" class="small">Cada token debe tener una mision.</text>
    </g>
  </g>
</svg>
