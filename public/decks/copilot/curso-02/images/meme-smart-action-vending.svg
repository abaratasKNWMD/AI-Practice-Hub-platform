<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Smart Action vending machine</title>
  <desc id="desc">A humorous vending machine for small bounded smart actions instead of large agent tasks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="1" stop-color="#071f1b"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 21px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:700 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Smart Action: accion pequena, valor rapido</text>
  <text x="72" y="122" class="small">No todo necesita una conversacion larga. A veces basta una accion contextual y revisable.</text>
  <g transform="translate(210 174)">
    <rect width="780" height="440" rx="34" class="card"/>
    <rect x="90" y="70" width="380" height="300" rx="30" fill="#07101e" stroke="#5ddcff" stroke-opacity=".24"/>
    <g transform="translate(130 112)">
      <rect width="130" height="58" rx="18" fill="#5ddcff" fill-opacity=".13" stroke="#5ddcff" stroke-opacity=".34"/>
      <text x="26" y="37" class="mono">tests</text>
      <rect x="170" width="130" height="58" rx="18" fill="#62e6a2" fill-opacity=".13" stroke="#62e6a2" stroke-opacity=".34"/>
      <text x="196" y="37" class="mono">fix</text>
      <rect y="90" width="130" height="58" rx="18" fill="#f8c96a" fill-opacity=".13" stroke="#f8c96a" stroke-opacity=".34"/>
      <text x="26" y="127" class="mono">docs</text>
      <rect x="170" y="90" width="130" height="58" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="196" y="127" class="mono">PR</text>
    </g>
    <text x="536" y="160" class="label">Elige accion</text>
    <text x="536" y="204" class="small">acotada al contexto</text>
    <text x="536" y="238" class="small">con diff revisable</text>
  </g>
</svg>
