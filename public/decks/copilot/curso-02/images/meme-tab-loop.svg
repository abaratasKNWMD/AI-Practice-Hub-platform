<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Tab suggestion loop</title>
  <desc id="desc">A humorous view of cycling Copilot suggestions without improving context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#071a18"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 22px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .key{font:900 28px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Si todas las sugerencias son malas, deja de ciclar</text>
  <text x="72" y="122" class="small">Cambiar de sugerencia sin cambiar contexto es dar vueltas en la misma habitacion.</text>
  <g transform="translate(146 182)">
    <rect width="908" height="410" rx="34" class="card"/>
    <g transform="translate(82 86)">
      <rect width="160" height="96" rx="24" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="48" y="60" class="key">TAB</text>
      <rect x="220" width="160" height="96" rx="24" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="268" y="60" class="key">TAB</text>
      <rect x="440" width="160" height="96" rx="24" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="488" y="60" class="key">TAB</text>
      <rect x="660" width="160" height="96" rx="24" fill="#ff8fab" fill-opacity=".13" stroke="#ff8fab" stroke-opacity=".38"/>
      <text x="700" y="60" class="key">?</text>
    </g>
    <g transform="translate(180 260)">
      <rect width="548" height="78" rx="24" fill="#62e6a2" fill-opacity=".13" stroke="#62e6a2" stroke-opacity=".36"/>
      <text x="34" y="48" class="label">Mejor movimiento: abrir test, nombrar funcion, escribir comentario</text>
    </g>
  </g>
</svg>
