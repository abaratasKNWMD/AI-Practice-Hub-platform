<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Controlled code completion</title>
  <desc id="desc">A code editor showing ghost text produced by clear names, comments and tests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 20px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:650 18px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .ghost{fill:#78e6d7;opacity:.55}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Completion: magia controlada</text>
  <text x="72" y="122" class="small">El ghost text mejora cuando el codigo deja pistas: nombre, tipos, comentario y test.</text>
  <g transform="translate(116 176)">
    <rect width="700" height="420" rx="28" class="card"/>
    <rect width="700" height="58" rx="28" fill="#ffffff" fill-opacity=".08"/>
    <circle cx="34" cy="30" r="8" fill="#ff6b83"/>
    <circle cx="62" cy="30" r="8" fill="#f8c96a"/>
    <circle cx="90" cy="30" r="8" fill="#62e6a2"/>
    <text x="126" y="37" class="small">premium-access.ts</text>
    <g transform="translate(42 104)">
      <text x="0" y="0" class="mono">// Return true when user can access premium</text>
      <text x="0" y="44" class="mono">function canUsePremiumFeature(user, plan) {</text>
      <text x="24" y="88" class="mono">if (!user || !plan) return false;</text>
      <text x="24" y="132" class="mono ghost">if (plan.status !== "active") return false;</text>
      <text x="24" y="176" class="mono ghost">return user.role === "admin" || plan.tier === "pro";</text>
      <text x="0" y="220" class="mono">}</text>
    </g>
  </g>
  <g transform="translate(850 228)">
    <rect width="242" height="100" rx="22" fill="#5ddcff" fill-opacity=".12" stroke="#5ddcff" stroke-opacity=".34"/>
    <text x="26" y="39" class="label">Nombre claro</text>
    <text x="26" y="68" class="small">canUsePremiumFeature</text>
    <rect y="126" width="242" height="100" rx="22" fill="#62e6a2" fill-opacity=".12" stroke="#62e6a2" stroke-opacity=".34"/>
    <text x="26" y="165" class="label">Comentario util</text>
    <text x="26" y="194" class="small">condicion verificable</text>
    <rect y="252" width="242" height="100" rx="22" fill="#f8c96a" fill-opacity=".12" stroke="#f8c96a" stroke-opacity=".34"/>
    <text x="26" y="291" class="label">Test abierto</text>
    <text x="26" y="320" class="small">edge cases visibles</text>
  </g>
</svg>
