<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ask Plan Agent modes</title>
  <desc id="desc">A humorous traffic light for Ask, Plan and Agent modes in Copilot Chat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="1" stop-color="#071f1b"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 22px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Ask, Plan y Agent no son estados de animo</text>
  <text x="72" y="122" class="small">Son contratos de trabajo distintos. Elegir mal crea coste, riesgo o frustracion.</text>
  <g transform="translate(162 184)">
    <rect width="876" height="410" rx="34" class="card"/>
    <g transform="translate(78 86)">
      <rect width="220" height="220" rx="34" fill="#5ddcff" fill-opacity=".13" stroke="#5ddcff" stroke-opacity=".36"/>
      <text x="58" y="62" class="label">ASK</text>
      <text x="34" y="112" class="small">entender</text>
      <text x="34" y="146" class="small">explicar</text>
      <text x="34" y="180" class="small">comparar</text>
      <rect x="280" width="220" height="220" rx="34" fill="#f8c96a" fill-opacity=".13" stroke="#f8c96a" stroke-opacity=".36"/>
      <text x="338" y="62" class="label">PLAN</text>
      <text x="314" y="112" class="small">pensar antes</text>
      <text x="314" y="146" class="small">acotar riesgo</text>
      <text x="314" y="180" class="small">ordenar pasos</text>
      <rect x="560" width="220" height="220" rx="34" fill="#62e6a2" fill-opacity=".13" stroke="#62e6a2" stroke-opacity=".36"/>
      <text x="612" y="62" class="label">AGENT</text>
      <text x="594" y="112" class="small">actuar</text>
      <text x="594" y="146" class="small">editar</text>
      <text x="594" y="180" class="small">usar tools</text>
    </g>
  </g>
</svg>
