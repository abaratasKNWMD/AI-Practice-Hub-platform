<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI review is not approval stamp</title>
  <desc id="desc">A review stamp warning that Copilot review is a lens rather than an approval stamp.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 22px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Review asistido no es sello de aprobado</text>
  <text x="72" y="122" class="small">Copilot ayuda a mirar. La responsabilidad de aprobar sigue siendo humana.</text>
  <g transform="translate(150 178)">
    <rect width="900" height="430" rx="34" class="card"/>
    <g transform="translate(88 88)">
      <rect width="360" height="250" rx="30" fill="#07101e" stroke="#5ddcff" stroke-opacity=".24"/>
      <text x="34" y="58" class="mono">finding: missing edge case</text>
      <text x="34" y="104" class="mono">risk: false positive access</text>
      <text x="34" y="150" class="mono">suggestion: add legacy test</text>
    </g>
    <g transform="translate(610 120) rotate(-12)">
      <rect width="190" height="118" rx="28" fill="#ff8fab" fill-opacity=".16" stroke="#ff8fab" stroke-width="5"/>
      <text x="42" y="70" class="label">APPROVED?</text>
    </g>
    <text x="590" y="370" class="small">No sin evidencia, severidad y verificacion.</text>
  </g>
</svg>
