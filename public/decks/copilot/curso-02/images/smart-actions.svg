<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Smart actions</title>
  <desc id="desc">A set of smart action cards for refactor, tests, completion, documentation and PR summaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="1" stop-color="#071a18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#5ddcff"/>
      <stop offset="1" stop-color="#62e6a2"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 20px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Smart Actions: ayuda justo donde hay friccion</text>
  <text x="72" y="122" class="small">Acciones acotadas, context-aware y revisables. No todo necesita Agent mode.</text>
  <g transform="translate(150 188)">
    <rect width="900" height="390" rx="32" class="card"/>
    <g transform="translate(60 72)">
      <rect width="220" height="112" rx="24" fill="#5ddcff" fill-opacity=".12" stroke="#5ddcff" stroke-opacity=".34"/>
      <text x="30" y="45" class="label">Refactor</text>
      <text x="30" y="76" class="small">reorganizar sin drama</text>
      <rect x="300" width="220" height="112" rx="24" fill="#62e6a2" fill-opacity=".12" stroke="#62e6a2" stroke-opacity=".34"/>
      <text x="330" y="45" class="label">Tests</text>
      <text x="330" y="76" class="small">casos desde seleccion</text>
      <rect x="600" width="220" height="112" rx="24" fill="#f8c96a" fill-opacity=".12" stroke="#f8c96a" stroke-opacity=".34"/>
      <text x="630" y="45" class="label">Completar</text>
      <text x="630" y="76" class="small">cerrar funcion</text>
      <rect x="150" y="160" width="220" height="112" rx="24" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="180" y="205" class="label">Docs</text>
      <text x="180" y="236" class="small">explicar el cambio</text>
      <rect x="450" y="160" width="220" height="112" rx="24" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="480" y="205" class="label">PR Summary</text>
      <text x="480" y="236" class="small">contexto para review</text>
    </g>
  </g>
</svg>
