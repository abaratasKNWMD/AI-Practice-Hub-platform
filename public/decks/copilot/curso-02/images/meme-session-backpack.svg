<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Old session backpack</title>
  <desc id="desc">A chat session carrying stale context like a heavy backpack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#071a18"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 21px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Una sesion vieja tambien pesa</text>
  <text x="72" y="122" class="small">Historial util y ruido acumulado se parecen mucho hasta que Copilot empieza a mezclar temas.</text>
  <g transform="translate(138 178)">
    <rect width="924" height="430" rx="34" class="card"/>
    <g transform="translate(90 90)">
      <rect width="330" height="250" rx="34" fill="#ff8fab" fill-opacity=".12" stroke="#ff8fab" stroke-opacity=".36"/>
      <text x="40" y="52" class="label">Sesion mochila</text>
      <text x="40" y="100" class="mono">bug login</text>
      <text x="40" y="138" class="mono">+ idea API</text>
      <text x="40" y="176" class="mono">+ test viejo</text>
      <text x="40" y="214" class="mono">+ prompt perdido</text>
    </g>
    <g transform="translate(520 90)">
      <rect width="330" height="250" rx="34" fill="#62e6a2" fill-opacity=".12" stroke="#62e6a2" stroke-opacity=".36"/>
      <text x="40" y="52" class="label">Sesion limpia</text>
      <text x="40" y="100" class="mono">objetivo actual</text>
      <text x="40" y="138" class="mono">archivos clave</text>
      <text x="40" y="176" class="mono">criterio cierre</text>
      <text x="40" y="214" class="mono">verificacion</text>
    </g>
  </g>
</svg>
