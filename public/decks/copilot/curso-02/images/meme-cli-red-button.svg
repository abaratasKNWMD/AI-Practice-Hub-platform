<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">CLI red button</title>
  <desc id="desc">A terminal safety reminder to inspect commands before allowing Copilot CLI tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#071a18"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 22px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Terminal: aqui el boton rojo si existe</text>
  <text x="72" y="122" class="small">En CLI, una respuesta puede convertirse en comando, fichero tocado o tool ejecutada.</text>
  <g transform="translate(150 174)">
    <rect width="900" height="434" rx="34" class="card"/>
    <rect x="70" y="78" width="520" height="250" rx="28" fill="#07101e" stroke="#5ddcff" stroke-opacity=".24"/>
    <text x="108" y="132" class="mono">$ copilot</text>
    <text x="108" y="184" class="mono">tool request: edit workspace</text>
    <text x="108" y="236" class="mono">scope: current folder</text>
    <text x="108" y="288" class="mono">status: waiting approval</text>
    <circle cx="732" cy="204" r="72" fill="#ff8fab" fill-opacity=".18" stroke="#ff8fab" stroke-width="8"/>
    <text x="674" y="214" class="label">PAUSA</text>
    <text x="618" y="344" class="small">Leer antes de permitir. Siempre.</text>
  </g>
</svg>
