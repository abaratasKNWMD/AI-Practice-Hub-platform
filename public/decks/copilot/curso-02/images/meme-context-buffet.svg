<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Context is not a buffet</title>
  <desc id="desc">A humorous context buffet showing that too much unrelated context hurts Copilot answers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 22px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:700 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Contexto no es buffet libre</text>
  <text x="72" y="122" class="small">Mas no siempre es mejor. Lo que ayuda es contexto relacionado con la decision.</text>
  <g transform="translate(118 184)">
    <rect width="444" height="398" rx="34" class="card"/>
    <text x="38" y="58" class="label">Plato imposible</text>
    <text x="52" y="120" class="mono">#codebase</text>
    <text x="52" y="162" class="mono">#terminal</text>
    <text x="52" y="204" class="mono">20 archivos abiertos</text>
    <text x="52" y="246" class="mono">chat de ayer</text>
    <text x="52" y="288" class="mono">README entero</text>
  </g>
  <g transform="translate(638 184)">
    <rect width="444" height="398" rx="34" class="card"/>
    <text x="38" y="58" class="label">Plato de trabajo</text>
    <text x="52" y="120" class="mono">archivo exacto</text>
    <text x="52" y="162" class="mono">test relacionado</text>
    <text x="52" y="204" class="mono">regla concreta</text>
    <text x="52" y="246" class="mono">criterio de cierre</text>
  </g>
</svg>
