<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Copilot Chat cockpit</title>
  <desc id="desc">A chat cockpit showing Ask, Plan and Agent with model, permissions and context controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#071f1b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#5ddcff"/>
      <stop offset="1" stop-color="#62e6a2"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 20px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:650 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Copilot Chat: conversar tambien es configurar</text>
  <text x="72" y="122" class="small">Modo, permisos, modelo y contexto definen la sesion antes de escribir el prompt.</text>
  <g transform="translate(120 170)">
    <rect width="640" height="430" rx="30" class="card"/>
    <rect width="640" height="58" rx="30" fill="#ffffff" fill-opacity=".08"/>
    <text x="34" y="37" class="small">copilot.chat.session</text>
    <g transform="translate(40 100)">
      <rect width="176" height="56" rx="18" fill="#5ddcff" fill-opacity=".16" stroke="#5ddcff" stroke-opacity=".42"/>
      <text x="62" y="36" class="label">Ask</text>
      <rect x="196" width="176" height="56" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="254" y="36" class="label">Plan</text>
      <rect x="392" width="176" height="56" rx="18" fill="#62e6a2" fill-opacity=".14" stroke="#62e6a2" stroke-opacity=".4"/>
      <text x="448" y="36" class="label">Agent</text>
      <rect y="100" width="568" height="170" rx="22" fill="#07101e" stroke="#5ddcff" stroke-opacity=".22"/>
      <text x="24" y="42" class="mono">Prompt: explica el fallo del test y dame plan.</text>
      <text x="24" y="82" class="mono">Contexto: #file cart.spec.ts + seleccion</text>
      <text x="24" y="122" class="mono">Cierre: no editar hasta validar el enfoque</text>
    </g>
  </g>
  <g transform="translate(812 204)">
    <rect width="254" height="82" rx="22" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="26" y="36" class="label">Modelo</text>
    <text x="26" y="62" class="small">rapido vs profundo</text>
    <rect y="112" width="254" height="82" rx="22" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="26" y="148" class="label">Permisos</text>
    <text x="26" y="174" class="small">leer, editar, ejecutar</text>
    <rect y="224" width="254" height="82" rx="22" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="26" y="260" class="label">Contexto</text>
    <text x="26" y="286" class="small">archivo, terminal, repo</text>
  </g>
  <path d="M780 400h-38" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
</svg>
