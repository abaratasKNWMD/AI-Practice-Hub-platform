<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Docker is not magic governance</title>
  <desc id="desc">A Docker MCP packaging reminder that containers do not remove the need for security review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 22px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Docker empaqueta. No absuelve.</text>
  <text x="72" y="122" class="small">Un MCP en contenedor sigue teniendo imagen, red, variables, permisos y owner.</text>
  <g transform="translate(150 184)">
    <rect width="900" height="398" rx="34" class="card"/>
    <rect x="92" y="110" width="320" height="170" rx="28" fill="#5ddcff" fill-opacity=".13" stroke="#5ddcff" stroke-opacity=".36"/>
    <text x="132" y="164" class="mono">docker run mcp</text>
    <text x="132" y="214" class="small">limpio y repetible</text>
    <rect x="540" y="92" width="260" height="210" rx="30" fill="#f8c96a" fill-opacity=".13" stroke="#f8c96a" stroke-opacity=".36"/>
    <text x="584" y="148" class="mono">review image</text>
    <text x="584" y="192" class="mono">env vars</text>
    <text x="584" y="236" class="mono">network</text>
  </g>
</svg>
