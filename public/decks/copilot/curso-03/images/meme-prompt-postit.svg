<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Prompt file is not a sticky note</title>
  <desc id="desc">A comparison between a random sticky-note prompt and a versioned prompt file workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 22px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Prompt file no es un post-it con suerte</text>
  <text x="72" y="122" class="small">Un prompt reutilizable necesita objetivo, variables, tools, salida y criterio de cierre.</text>
  <g transform="translate(110 184)">
    <rect width="440" height="398" rx="34" class="card"/>
    <text x="38" y="58" class="label">Post-it</text>
    <rect x="82" y="112" width="260" height="210" rx="22" fill="#f8c96a" fill-opacity=".18" stroke="#f8c96a" stroke-opacity=".42"/>
    <text x="112" y="172" class="mono">haz README</text>
    <text x="112" y="216" class="mono">bien</text>
  </g>
  <g transform="translate(650 184)">
    <rect width="440" height="398" rx="34" class="card"/>
    <text x="38" y="58" class="label">Workflow</text>
    <text x="58" y="122" class="mono">mode: agent</text>
    <text x="58" y="166" class="mono">tools: codebase</text>
    <text x="58" y="210" class="mono">input: release</text>
    <text x="58" y="254" class="mono">output: sections</text>
    <text x="58" y="298" class="mono">verify: markdownlint</text>
  </g>
</svg>
