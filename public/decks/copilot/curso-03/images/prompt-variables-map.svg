<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Prompt variables workflow map</title>
  <desc id="desc">Prompt variables for workspace, selection, file and user input feeding a reusable workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#5ddcff"/>
      <stop offset="1" stop-color="#62e6a2"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 20px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:650 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#77e6d0"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Variables: parametrizar sin perder criterio</text>
  <text x="72" y="122" class="small">Una variable buena reduce ambiguedad; una variable por costumbre crea prompts fragiles.</text>
  <g transform="translate(94 202)">
    <rect width="250" height="82" rx="24" class="card"/><text x="28" y="50" class="mono">${workspaceFolder}</text>
    <rect y="112" width="250" height="82" rx="24" class="card"/><text x="28" y="160" class="mono">${selection}</text>
    <rect y="224" width="250" height="82" rx="24" class="card"/><text x="28" y="272" class="mono">${file}</text>
  </g>
  <g transform="translate(474 244)">
    <rect width="252" height="220" rx="34" fill="#ffffff" fill-opacity=".08" stroke="url(#accent)" stroke-width="2"/>
    <text x="44" y="86" class="label">Workflow</text>
    <text x="44" y="120" class="small">entrada controlada</text>
    <text x="44" y="150" class="small">salida verificable</text>
  </g>
  <g transform="translate(856 244)">
    <rect width="250" height="220" rx="28" class="card"/>
    <text x="30" y="52" class="label">Resultado</text>
    <text x="30" y="92" class="small">mismo procedimiento</text>
    <text x="30" y="126" class="small">distinto archivo</text>
    <text x="30" y="160" class="small">menos copiar-pegar</text>
  </g>
  <path d="M356 243H464" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M356 355H464" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M356 467C418 486 450 474 486 456" stroke="url(#accent)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M738 354H846" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
