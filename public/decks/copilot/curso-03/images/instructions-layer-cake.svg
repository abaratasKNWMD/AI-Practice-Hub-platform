<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Instruction layers</title>
  <desc id="desc">A layered cake of Copilot instructions from organization, repository, file-based rules and user preferences.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#071f1b"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 20px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:650 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Instrucciones: memoria operativa versionada</text>
  <text x="72" y="122" class="small">Demasiadas capas crean ruido; las buenas capas reducen incertidumbre.</text>
  <g transform="translate(198 188)">
    <rect width="804" height="390" rx="32" class="card"/>
    <g transform="translate(118 78)">
      <rect width="568" height="58" rx="22" fill="#5ddcff" fill-opacity=".13" stroke="#5ddcff" stroke-opacity=".36"/>
      <text x="30" y="37" class="label">Org policy</text>
      <text x="300" y="37" class="small">seguridad y compliance</text>
      <rect x="36" y="72" width="496" height="58" rx="22" fill="#62e6a2" fill-opacity=".13" stroke="#62e6a2" stroke-opacity=".36"/>
      <text x="66" y="109" class="label">Repository</text>
      <text x="300" y="109" class="small">.github/copilot-instructions.md</text>
      <rect x="72" y="144" width="424" height="58" rx="22" fill="#f8c96a" fill-opacity=".13" stroke="#f8c96a" stroke-opacity=".36"/>
      <text x="102" y="181" class="label">File-based</text>
      <text x="300" y="181" class="small">*.instructions.md</text>
      <rect x="108" y="216" width="352" height="58" rx="22" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="138" y="253" class="label">User</text>
      <text x="300" y="253" class="small">preferencias personales</text>
    </g>
  </g>
  <text x="330" y="645" class="mono">regla: poco, concreto, verificable y revisado en PR</text>
</svg>
