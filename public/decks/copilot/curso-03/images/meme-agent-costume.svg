<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent is not a costume</title>
  <desc id="desc">A custom agent warning that role names are not enough without limits, tools and output format.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="1" stop-color="#071f1b"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 22px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Un agente no es un disfraz</text>
  <text x="72" y="122" class="small">Llamarlo "senior architect" no basta. Necesita tarea, limites, tools y salida verificable.</text>
  <g transform="translate(128 184)">
    <rect width="430" height="398" rx="34" class="card"/>
    <text x="38" y="60" class="label">Nombre dramatico</text>
    <rect x="70" y="116" width="290" height="150" rx="34" fill="#ff8fab" fill-opacity=".13" stroke="#ff8fab" stroke-opacity=".38"/>
    <text x="106" y="180" class="mono">ULTRA SENIOR</text>
    <text x="106" y="220" class="mono">AI ARCHITECT</text>
    <text x="58" y="332" class="small">Sin limites, es solo teatro de prompts.</text>
  </g>
  <g transform="translate(642 184)">
    <rect width="430" height="398" rx="34" class="card"/>
    <text x="38" y="60" class="label">Agente real</text>
    <text x="58" y="128" class="mono">role: reviewer</text>
    <text x="58" y="174" class="mono">tools: read-only</text>
    <text x="58" y="220" class="mono">output: findings</text>
    <text x="58" y="266" class="mono">stop: no edits</text>
  </g>
</svg>
