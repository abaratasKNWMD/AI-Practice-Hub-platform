<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Copilot advanced platform</title>
  <desc id="desc">A platform cockpit showing instructions, agents, prompt files and MCP as advanced Copilot configuration layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.5" stop-color="#101a33"/>
      <stop offset="1" stop-color="#071f1b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#5ddcff"/>
      <stop offset="1" stop-color="#62e6a2"/>
    </linearGradient>
    <style>
      .title{font:900 38px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 21px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:650 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <circle cx="210" cy="168" r="150" fill="#5ddcff" opacity=".13"/>
  <circle cx="980" cy="586" r="190" fill="#62e6a2" opacity=".12"/>
  <text x="70" y="92" class="title">Copilot avanzado: de uso a plataforma</text>
  <text x="72" y="126" class="small">El conocimiento del equipo se convierte en configuracion versionada y reutilizable.</text>

  <g transform="translate(142 196)">
    <rect width="916" height="386" rx="34" class="card"/>
    <rect x="56" y="64" width="804" height="78" rx="26" fill="#5ddcff" fill-opacity=".12" stroke="#5ddcff" stroke-opacity=".36"/>
    <text x="92" y="112" class="label">Instructions</text>
    <text x="300" y="112" class="small">reglas persistentes de equipo y repositorio</text>
    <rect x="56" y="154" width="804" height="78" rx="26" fill="#62e6a2" fill-opacity=".12" stroke="#62e6a2" stroke-opacity=".36"/>
    <text x="92" y="202" class="label">Agents</text>
    <text x="300" y="202" class="small">roles especializados, limites y handoffs</text>
    <rect x="56" y="244" width="804" height="78" rx="26" fill="#f8c96a" fill-opacity=".12" stroke="#f8c96a" stroke-opacity=".36"/>
    <text x="92" y="292" class="label">Prompt files</text>
    <text x="300" y="292" class="small">workflows lanzables bajo demanda</text>
    <rect x="56" y="334" width="804" height="78" rx="26" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="92" y="382" class="label">MCP</text>
    <text x="300" y="382" class="small">contexto externo, tools y gobierno</text>
  </g>

  <g transform="translate(394 622)">
    <rect width="412" height="66" rx="24" fill="#ffffff" fill-opacity=".08" stroke="url(#accent)" stroke-width="2"/>
    <text x="34" y="42" class="mono">configuracion = memoria operativa</text>
  </g>
</svg>
