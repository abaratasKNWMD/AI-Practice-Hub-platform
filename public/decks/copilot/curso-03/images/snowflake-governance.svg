<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Snowflake setup versus governed repository</title>
  <desc id="desc">A playful comparison between snowflake local settings and repository-governed Copilot instructions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#071a18"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 22px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:650 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Entornos copo de nieve: divertido hasta que hay soporte</text>
  <text x="72" y="122" class="small">Si cada maquina tiene reglas invisibles, cada respuesta de Copilot parece una loteria.</text>
  <g transform="translate(96 188)">
    <rect width="470" height="390" rx="32" class="card"/>
    <text x="38" y="58" class="label">Copo de nieve</text>
    <g transform="translate(236 206)">
      <path d="M0-96V96M-83-48L83 48M83-48L-83 48M-54-54l54 54 54-54M-54 54L0 0l54 54" stroke="#5ddcff" stroke-width="8" stroke-linecap="round" opacity=".75"/>
    </g>
    <text x="42" y="326" class="small">Reglas solo en usuario, nadie sabe que aplica.</text>
  </g>
  <g transform="translate(634 188)">
    <rect width="470" height="390" rx="32" class="card"/>
    <text x="38" y="58" class="label">Repo gobierna</text>
    <rect x="70" y="104" width="330" height="206" rx="24" fill="#07101e" stroke="#62e6a2" stroke-opacity=".36"/>
    <text x="100" y="150" class="mono">.github/</text>
    <text x="128" y="194" class="mono">copilot-instructions.md</text>
    <text x="128" y="238" class="mono">review.instructions.md</text>
    <text x="128" y="282" class="mono">security.instructions.md</text>
    <text x="42" y="350" class="small">Cambios versionados, revisados y reproducibles.</text>
  </g>
</svg>
