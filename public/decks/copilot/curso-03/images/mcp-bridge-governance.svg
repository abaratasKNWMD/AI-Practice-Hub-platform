<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">MCP governed bridge</title>
  <desc id="desc">A governed MCP bridge connecting Copilot to external systems with inventory, permissions, logs and read-only first controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="1" stop-color="#071f1b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#5ddcff"/>
      <stop offset="1" stop-color="#62e6a2"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 20px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:650 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#77e6d0"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">MCP: enchufe gobernado, no magia</text>
  <text x="72" y="122" class="small">El servidor MCP es frontera, contrato y punto de auditoria entre Copilot y sistemas externos.</text>
  <g transform="translate(92 252)">
    <rect width="230" height="150" rx="28" class="card"/>
    <text x="34" y="58" class="label">Copilot</text>
    <text x="34" y="92" class="small">Chat / Agent</text>
  </g>
  <g transform="translate(466 206)">
    <rect width="268" height="242" rx="34" fill="#ffffff" fill-opacity=".08" stroke="url(#accent)" stroke-width="2"/>
    <text x="48" y="70" class="label">MCP Server</text>
    <text x="48" y="112" class="small">tools declaradas</text>
    <text x="48" y="146" class="small">variables seguras</text>
    <text x="48" y="180" class="small">logs revisables</text>
  </g>
  <g transform="translate(878 184)">
    <rect width="230" height="86" rx="24" class="card"/><text x="30" y="52" class="label">Docs</text>
    <rect y="112" width="230" height="86" rx="24" class="card"/><text x="30" y="164" class="label">Issues</text>
    <rect y="224" width="230" height="86" rx="24" class="card"/><text x="30" y="276" class="label">Services</text>
  </g>
  <path d="M332 327H456" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M746 327H866" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(288 558)">
    <rect width="624" height="72" rx="24" class="card"/>
    <text x="36" y="45" class="mono">inventario + readonly primero + scopes + logs</text>
  </g>
</svg>
