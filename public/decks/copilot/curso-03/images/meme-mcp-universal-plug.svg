<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">MCP is not a universal plug</title>
  <desc id="desc">A humorous MCP plug diagram warning that every connection needs owner, scope and logs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="1" stop-color="#071a18"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 22px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">MCP no es un enchufe universal</text>
  <text x="72" y="122" class="small">Cada conexion necesita owner, scope, credenciales seguras, logs y plan de retirada.</text>
  <g transform="translate(142 184)">
    <rect width="916" height="398" rx="34" class="card"/>
    <g transform="translate(96 116)">
      <rect width="260" height="150" rx="32" fill="#5ddcff" fill-opacity=".13" stroke="#5ddcff" stroke-opacity=".36"/>
      <text x="54" y="86" class="label">Copilot</text>
      <path d="M306 75h130" stroke="#62e6a2" stroke-width="16" stroke-linecap="round"/>
      <rect x="450" y="36" width="130" height="78" rx="24" fill="#62e6a2" fill-opacity=".14" stroke="#62e6a2" stroke-opacity=".38"/>
      <text x="482" y="83" class="mono">MCP</text>
      <path d="M600 75h130" stroke="#62e6a2" stroke-width="16" stroke-linecap="round"/>
      <rect x="750" width="74" height="150" rx="24" fill="#ff8fab" fill-opacity=".13" stroke="#ff8fab" stroke-opacity=".38"/>
      <text x="668" y="220" class="small">No conectar sin contrato.</text>
    </g>
  </g>
</svg>
