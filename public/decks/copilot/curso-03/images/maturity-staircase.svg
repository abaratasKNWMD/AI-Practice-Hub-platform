<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Copilot maturity staircase</title>
  <desc id="desc">A maturity staircase from instructions to file rules, agents, prompt files, readonly MCP and governance metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="1" stop-color="#071a18"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 18px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Ruta de madurez: subir sin saltarse peldaños</text>
  <text x="72" y="122" class="small">MCP y agentes potentes llegan despues de instrucciones y review basicos funcionando.</text>
  <g transform="translate(154 526)">
    <rect width="152" height="74" rx="20" fill="#5ddcff" fill-opacity=".13" stroke="#5ddcff" stroke-opacity=".34"/><text x="24" y="45" class="label">Instructions</text>
    <rect x="154" y="-74" width="152" height="148" rx="20" fill="#62e6a2" fill-opacity=".13" stroke="#62e6a2" stroke-opacity=".34"/><text x="178" y="-2" class="label">File rules</text>
    <rect x="308" y="-148" width="152" height="222" rx="20" fill="#f8c96a" fill-opacity=".13" stroke="#f8c96a" stroke-opacity=".34"/><text x="332" y="-38" class="label">Agents</text>
    <rect x="462" y="-222" width="152" height="296" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/><text x="486" y="-76" class="label">Prompts</text>
    <rect x="616" y="-296" width="152" height="370" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/><text x="640" y="-112" class="label">MCP RO</text>
    <rect x="770" y="-370" width="152" height="444" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/><text x="794" y="-150" class="label">Governance</text>
  </g>
  <text x="330" y="660" class="small">Coste, permisos y calidad se miden antes de escalar.</text>
</svg>
