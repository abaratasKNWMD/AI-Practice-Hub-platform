<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent handoff pipeline</title>
  <desc id="desc">A sequential handoff pipeline from planner to implementer to reviewer to security with compressed context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#5ddcff"/>
      <stop offset="1" stop-color="#62e6a2"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 20px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:650 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#77e6d0"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Handoffs: contexto util, no historia completa</text>
  <text x="72" y="122" class="small">Cada agente recibe lo que necesita para su responsabilidad y deja una salida verificable.</text>
  <g transform="translate(78 258)">
    <rect width="210" height="126" rx="26" fill="#5ddcff" fill-opacity=".13" stroke="#5ddcff" stroke-opacity=".36"/>
    <text x="34" y="52" class="label">Planner</text>
    <text x="34" y="84" class="small">alcance y riesgos</text>
  </g>
  <g transform="translate(360 258)">
    <rect width="210" height="126" rx="26" fill="#62e6a2" fill-opacity=".13" stroke="#62e6a2" stroke-opacity=".36"/>
    <text x="34" y="52" class="label">Implementer</text>
    <text x="34" y="84" class="small">cambios acotados</text>
  </g>
  <g transform="translate(642 258)">
    <rect width="210" height="126" rx="26" fill="#f8c96a" fill-opacity=".13" stroke="#f8c96a" stroke-opacity=".36"/>
    <text x="34" y="52" class="label">Reviewer</text>
    <text x="34" y="84" class="small">findings y tests</text>
  </g>
  <g transform="translate(924 258)">
    <rect width="210" height="126" rx="26" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="34" y="52" class="label">Security</text>
    <text x="34" y="84" class="small">datos y permisos</text>
  </g>
  <path d="M298 321H350" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M580 321H632" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M862 321H914" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(270 476)">
    <rect width="660" height="82" rx="26" class="card"/>
    <text x="36" y="35" class="mono">handoff payload: objetivo + archivos + decisiones + riesgos</text>
    <text x="36" y="62" class="small">Si pasas todo el chat, pasas tambien el ruido.</text>
  </g>
</svg>
