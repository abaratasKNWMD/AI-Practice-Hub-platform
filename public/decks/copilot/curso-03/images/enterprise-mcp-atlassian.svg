<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise MCP system map</title>
  <desc id="desc">An enterprise MCP map connecting functional documentation, planning, engineering and identity governance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#5ddcff"/>
      <stop offset="1" stop-color="#62e6a2"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 20px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#77e6d0"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">MCP enterprise: mas organizativo que tecnico</text>
  <text x="72" y="122" class="small">Conectar sistemas de negocio exige owner, identidad, permisos e inventario.</text>
  <g transform="translate(460 250)">
    <rect width="280" height="180" rx="34" fill="#ffffff" fill-opacity=".08" stroke="url(#accent)" stroke-width="2"/>
    <text x="58" y="74" class="label">MCP Gateway</text>
    <text x="58" y="112" class="small">identity + scopes + logs</text>
  </g>
  <g transform="translate(90 202)">
    <rect width="230" height="100" rx="26" class="card"/><text x="32" y="58" class="label">Docs</text>
    <rect y="168" width="230" height="100" rx="26" class="card"/><text x="32" y="226" class="label">Product</text>
  </g>
  <g transform="translate(880 202)">
    <rect width="230" height="100" rx="26" class="card"/><text x="32" y="58" class="label">Backlog</text>
    <rect y="168" width="230" height="100" rx="26" class="card"/><text x="32" y="226" class="label">Repos</text>
  </g>
  <path d="M332 252H450" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M332 420H450" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M750 252H868" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M750 420H868" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(298 578)">
    <rect width="604" height="74" rx="24" class="card"/>
    <text x="36" y="46" class="small">Riesgo central: impersonacion, credenciales y permiso excesivo.</text>
  </g>
</svg>
