<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Too many custom agents</title>
  <desc id="desc">A crowded agent catalog warning that too many agents without criteria create confusion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#071a18"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 21px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:700 15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Un catalogo de 37 agentes no es una estrategia</text>
  <text x="72" y="122" class="small">Si nadie sabe cual usar, el catalogo se convierte en otra fuente de soporte.</text>
  <g transform="translate(126 176)">
    <rect width="948" height="432" rx="34" class="card"/>
    <g transform="translate(70 74)">
      <rect width="160" height="58" rx="18" fill="#5ddcff" fill-opacity=".13" stroke="#5ddcff" stroke-opacity=".34"/><text x="24" y="36" class="mono">reviewer</text>
      <rect x="190" width="160" height="58" rx="18" fill="#62e6a2" fill-opacity=".13" stroke="#62e6a2" stroke-opacity=".34"/><text x="214" y="36" class="mono">planner</text>
      <rect x="380" width="160" height="58" rx="18" fill="#f8c96a" fill-opacity=".13" stroke="#f8c96a" stroke-opacity=".34"/><text x="404" y="36" class="mono">security</text>
      <rect x="570" width="160" height="58" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/><text x="594" y="36" class="mono">explainer</text>
      <rect y="90" width="160" height="58" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/><text x="24" y="126" class="mono">helper</text>
      <rect x="190" y="90" width="160" height="58" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/><text x="214" y="126" class="mono">helper-2</text>
      <rect x="380" y="90" width="160" height="58" rx="18" fill="#ff8fab" fill-opacity=".12" stroke="#ff8fab" stroke-opacity=".34"/><text x="404" y="126" class="mono">mega-fix</text>
      <rect x="570" y="90" width="160" height="58" rx="18" fill="#ff8fab" fill-opacity=".12" stroke="#ff8fab" stroke-opacity=".34"/><text x="594" y="126" class="mono">super-dev</text>
      <rect y="210" width="730" height="78" rx="24" fill="#62e6a2" fill-opacity=".13" stroke="#62e6a2" stroke-opacity=".36"/>
      <text x="34" y="258" class="label">Mejor: pocos roles reales, owner claro y pruebas repetibles</text>
    </g>
  </g>
</svg>
