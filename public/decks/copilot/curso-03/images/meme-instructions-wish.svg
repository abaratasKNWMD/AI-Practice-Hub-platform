<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Instructions are not wishes</title>
  <desc id="desc">A humorous comparison between vague Copilot instructions and concrete versioned rules.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#071a18"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 22px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Las instrucciones no son deseos</text>
  <text x="72" y="122" class="small">"Haz codigo bueno" no es una regla. Una regla buena se puede comprobar.</text>
  <g transform="translate(96 184)">
    <rect width="470" height="398" rx="34" class="card"/>
    <text x="38" y="58" class="label">Deseo bonito</text>
    <rect x="50" y="112" width="360" height="120" rx="28" fill="#ff8fab" fill-opacity=".13" stroke="#ff8fab" stroke-opacity=".38"/>
    <text x="82" y="164" class="mono">"Write clean code"</text>
    <text x="82" y="204" class="small">Nadie sabe que significa aqui.</text>
  </g>
  <g transform="translate(634 184)">
    <rect width="470" height="398" rx="34" class="card"/>
    <text x="38" y="58" class="label">Regla util</text>
    <rect x="50" y="104" width="360" height="168" rx="28" fill="#62e6a2" fill-opacity=".13" stroke="#62e6a2" stroke-opacity=".38"/>
    <text x="82" y="148" class="mono">- Add unit tests</text>
    <text x="82" y="188" class="mono">- Keep public API</text>
    <text x="82" y="228" class="mono">- Explain breaking changes</text>
  </g>
</svg>
