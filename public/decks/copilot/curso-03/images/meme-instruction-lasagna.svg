<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Too many instruction layers</title>
  <desc id="desc">A funny instruction layer stack warning that too many instructions can create noise.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .title{font:900 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .label{font:850 21px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .small{font:700 15px Inter,Segoe UI,sans-serif;fill:#aebbd0}
      .mono{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8f7}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.14}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" class="title">Capas de instrucciones: bien. Lasagna infinita: mal.</text>
  <text x="72" y="122" class="small">Si cada capa contradice otra, Copilot no recibe criterio: recibe ruido con formato Markdown.</text>
  <g transform="translate(214 178)">
    <rect width="772" height="432" rx="34" class="card"/>
    <g transform="translate(130 78)">
      <rect width="512" height="54" rx="20" fill="#5ddcff" fill-opacity=".14" stroke="#5ddcff" stroke-opacity=".36"/>
      <text x="30" y="35" class="mono">org-policy.instructions.md</text>
      <rect y="68" width="512" height="54" rx="20" fill="#62e6a2" fill-opacity=".14" stroke="#62e6a2" stroke-opacity=".36"/>
      <text x="30" y="103" class="mono">repo copilot-instructions.md</text>
      <rect y="136" width="512" height="54" rx="20" fill="#f8c96a" fill-opacity=".14" stroke="#f8c96a" stroke-opacity=".36"/>
      <text x="30" y="171" class="mono">react.instructions.md</text>
      <rect y="204" width="512" height="54" rx="20" fill="#ff8fab" fill-opacity=".13" stroke="#ff8fab" stroke-opacity=".36"/>
      <text x="30" y="239" class="mono">user random preferences</text>
      <rect y="272" width="512" height="54" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="30" y="307" class="mono">old rule nobody owns</text>
    </g>
  </g>
</svg>
