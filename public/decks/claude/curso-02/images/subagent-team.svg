<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Subagent team</title>
  <desc id="desc">Claude subagent team with explorer, QA, security and architect roles.</desc>
  <rect width="1100" height="620" rx="34" fill="#0b0a09"/>
  <text x="95" y="112" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7f0">Subagentes por rol</text>
  <g transform="translate(120 220)" font-family="Inter, Arial, sans-serif">
    <rect width="200" height="170" rx="24" fill="#111817" stroke="#75e6c0" stroke-opacity="0.45"/>
    <text x="100" y="76" text-anchor="middle" font-size="24" font-weight="900" fill="#c9fff0">Explorer</text>
    <text x="100" y="112" text-anchor="middle" font-size="15" fill="#b9aea3">read-only</text>
    <rect x="230" width="200" height="170" rx="24" fill="#171313" stroke="#ffd27a" stroke-opacity="0.45"/>
    <text x="330" y="76" text-anchor="middle" font-size="24" font-weight="900" fill="#ffe6ad">QA</text>
    <text x="330" y="112" text-anchor="middle" font-size="15" fill="#b9aea3">tests</text>
    <rect x="460" width="200" height="170" rx="24" fill="#211713" stroke="#ff9aad" stroke-opacity="0.45"/>
    <text x="560" y="76" text-anchor="middle" font-size="24" font-weight="900" fill="#ffdfe5">Security</text>
    <text x="560" y="112" text-anchor="middle" font-size="15" fill="#b9aea3">risk</text>
    <rect x="690" width="200" height="170" rx="24" fill="#101418" stroke="#7bd7ff" stroke-opacity="0.45"/>
    <text x="790" y="76" text-anchor="middle" font-size="24" font-weight="900" fill="#d8f4ff">Architect</text>
    <text x="790" y="112" text-anchor="middle" font-size="15" fill="#b9aea3">tradeoffs</text>
  </g>
</svg>
