<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Skills factory</title>
  <desc id="desc">Skills factory turning repeated prompts into reusable skills.</desc>
  <rect width="1000" height="560" rx="34" fill="#0e1112"/>
  <text x="500" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="850" fill="#fff4eb">Fabrica de skills</text>
  <path d="M124 290H876" stroke="#2f2925" stroke-width="14" stroke-linecap="round"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="110" y="210" width="190" height="160" rx="22" fill="#171311" stroke="#ff9aad"/>
    <text x="205" y="276" font-size="22" font-weight="850" fill="#ffdfe5">Prompt repetido</text>
    <text x="205" y="314" font-size="15" fill="#b9aea3">copy paste diario</text>
    <rect x="405" y="190" width="190" height="200" rx="22" fill="#171311" stroke="#ffd27a"/>
    <text x="500" y="268" font-size="22" font-weight="850" fill="#fff0c9">SKILL.md</text>
    <text x="500" y="306" font-size="15" fill="#b9aea3">contrato + recursos</text>
    <rect x="700" y="210" width="190" height="160" rx="22" fill="#171311" stroke="#75e6c0"/>
    <text x="795" y="276" font-size="22" font-weight="850" fill="#d8fff1">Workflow</text>
    <text x="795" y="314" font-size="15" fill="#b9aea3">invocable y medible</text>
  </g>
</svg>
