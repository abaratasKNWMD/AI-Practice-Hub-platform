<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">MCP gateway</title>
  <desc id="desc">MCP gateway with data, permissions, owner and audit.</desc>
  <rect width="1100" height="620" rx="34" fill="#0c0a09"/>
  <text x="92" y="112" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7f0">MCP gateway</text>
  <text x="92" y="148" font-family="Inter, Arial, sans-serif" font-size="18" fill="#b9aea3">Conectar herramientas con contrato, no con impulso.</text>
  <g transform="translate(120 220)" font-family="Inter, Arial, sans-serif">
    <rect width="230" height="210" rx="26" fill="#181310" stroke="#fff" stroke-opacity="0.18"/>
    <text x="115" y="92" text-anchor="middle" font-size="26" font-weight="900" fill="#fff7f0">Claude</text>
    <text x="115" y="128" text-anchor="middle" font-size="15" fill="#b9aea3">necesita dato</text>
    <path d="M260 105H390" stroke="#ffd27a" stroke-width="6" stroke-linecap="round"/>
    <rect x="420" y="-20" width="210" height="250" rx="26" fill="#171313" stroke="#ffd27a" stroke-opacity="0.42"/>
    <text x="525" y="55" text-anchor="middle" font-size="25" font-weight="900" fill="#ffe6ad">MCP</text>
    <text x="525" y="98" text-anchor="middle" font-size="15" fill="#b9aea3">readonly</text>
    <text x="525" y="130" text-anchor="middle" font-size="15" fill="#b9aea3">owner</text>
    <text x="525" y="162" text-anchor="middle" font-size="15" fill="#b9aea3">datos</text>
    <text x="525" y="194" text-anchor="middle" font-size="15" fill="#b9aea3">audit</text>
    <path d="M660 105H790" stroke="#75e6c0" stroke-width="6" stroke-linecap="round"/>
    <rect x="820" width="230" height="210" rx="26" fill="#111817" stroke="#75e6c0" stroke-opacity="0.42"/>
    <text x="935" y="74" text-anchor="middle" font-size="24" font-weight="900" fill="#c9fff0">Fuentes</text>
    <text x="935" y="116" text-anchor="middle" font-size="15" fill="#b9aea3">docs</text>
    <text x="935" y="148" text-anchor="middle" font-size="15" fill="#b9aea3">issues</text>
    <text x="935" y="180" text-anchor="middle" font-size="15" fill="#b9aea3">apis internas</text>
  </g>
