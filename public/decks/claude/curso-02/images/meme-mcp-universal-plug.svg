<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">MCP universal plug meme</title>
  <desc id="desc">Meme about MCP not being a universal magic plug.</desc>
  <rect width="1000" height="560" rx="34" fill="#11100f"/>
  <text x="500" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="850" fill="#fff4eb">MCP no es enchufe universal</text>
  <rect x="180" y="170" width="250" height="180" rx="28" fill="#171311" stroke="#ff9aad"/>
  <rect x="570" y="170" width="250" height="180" rx="28" fill="#171311" stroke="#75e6c0"/>
  <path d="M430 260H570" stroke="#ffd27a" stroke-width="16" stroke-linecap="round" stroke-dasharray="18 18"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="305" y="266" font-size="26" font-weight="850" fill="#ffdfe5">Tool rara</text>
    <text x="695" y="266" font-size="26" font-weight="850" fill="#d8fff1">Claude</text>
  </g>
  <text x="500" y="460" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850" fill="#fff4eb">Conectar es facil. Gobernar es el curso.</text>
</svg>
