<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Operator cost panel</title>
  <desc id="desc">Cost panel with context, model, tools and rework.</desc>
  <rect width="1100" height="620" rx="34" fill="#0d0b0a"/>
  <text x="92" y="110" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7f0">Panel de coste</text>
  <text x="92" y="146" font-family="Inter, Arial, sans-serif" font-size="18" fill="#b9aea3">El gasto se escapa cuando el bucle no esta diseñado.</text>
  <g transform="translate(120 220)" font-family="Inter, Arial, sans-serif">
    <rect width="860" height="250" rx="28" fill="#15110f" stroke="#fff" stroke-opacity="0.12"/>
    <g transform="translate(40 45)">
      <rect width="170" height="160" rx="22" fill="#111817" stroke="#75e6c0" stroke-opacity="0.42"/>
      <text x="85" y="58" text-anchor="middle" font-size="21" font-weight="900" fill="#c9fff0">Contexto</text>
      <text x="85" y="98" text-anchor="middle" font-size="14" fill="#b9aea3">menos ruido</text>
      <rect x="28" y="120" width="114" height="16" rx="8" fill="#75e6c0"/>
    </g>
    <g transform="translate(245 45)">
      <rect width="170" height="160" rx="22" fill="#171313" stroke="#ffd27a" stroke-opacity="0.42"/>
      <text x="85" y="58" text-anchor="middle" font-size="21" font-weight="900" fill="#ffe6ad">Modelo</text>
      <text x="85" y="98" text-anchor="middle" font-size="14" fill="#b9aea3">segun riesgo</text>
      <rect x="28" y="120" width="92" height="16" rx="8" fill="#ffd27a"/>
    </g>
    <g transform="translate(450 45)">
      <rect width="170" height="160" rx="22" fill="#101418" stroke="#7bd7ff" stroke-opacity="0.42"/>
      <text x="85" y="58" text-anchor="middle" font-size="21" font-weight="900" fill="#d8f4ff">Tools</text>
      <text x="85" y="98" text-anchor="middle" font-size="14" fill="#b9aea3">scope claro</text>
      <rect x="28" y="120" width="76" height="16" rx="8" fill="#7bd7ff"/>
    </g>
    <g transform="translate(655 45)">
      <rect width="170" height="160" rx="22" fill="#211713" stroke="#ff9aad" stroke-opacity="0.42"/>
      <text x="85" y="58" text-anchor="middle" font-size="21" font-weight="900" fill="#ffdfe5">Rework</text>
      <text x="85" y="98" text-anchor="middle" font-size="14" fill="#b9aea3">lo mas caro</text>
      <rect x="28" y="120" width="132" height="16" rx="8" fill="#ff9aad"/>
    </g>
  </g>
</svg>
