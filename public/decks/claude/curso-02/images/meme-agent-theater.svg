<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Agent theater meme</title>
  <desc id="desc">Meme about agent roles without contracts.</desc>
  <rect width="1000" height="560" rx="34" fill="#11100f"/>
  <text x="500" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="850" fill="#fff4eb">Teatro de agentes</text>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="140" y="170" width="190" height="220" rx="24" fill="#171311" stroke="#ff9aad"/>
    <text x="235" y="248" font-size="22" font-weight="850" fill="#ffdfe5">Planner</text>
    <text x="235" y="306" font-size="15" fill="#b9aea3">misma tool</text>
    <rect x="405" y="170" width="190" height="220" rx="24" fill="#171311" stroke="#ffd27a"/>
    <text x="500" y="248" font-size="22" font-weight="850" fill="#fff0c9">Thinker</text>
    <text x="500" y="306" font-size="15" fill="#b9aea3">misma salida</text>
    <rect x="670" y="170" width="190" height="220" rx="24" fill="#171311" stroke="#75e6c0"/>
    <text x="765" y="248" font-size="22" font-weight="850" fill="#d8fff1">Reviewer</text>
    <text x="765" y="306" font-size="15" fill="#b9aea3">mismo contexto</text>
  </g>
  <text x="500" y="482" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850" fill="#fff4eb">Sin contrato, solo hay nombres.</text>
</svg>
