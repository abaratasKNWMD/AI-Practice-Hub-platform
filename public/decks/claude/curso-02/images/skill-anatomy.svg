<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Skill anatomy</title>
  <desc id="desc">Anatomy of Claude skill with frontmatter, instructions, references and scripts.</desc>
  <rect width="1100" height="620" rx="34" fill="#0b0a09"/>
  <rect x="120" y="78" width="860" height="464" rx="28" fill="#15110f" stroke="#fff" stroke-opacity="0.12"/>
  <text x="158" y="132" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7f0">SKILL.md</text>
  <g transform="translate(158 185)" font-family="Inter, Arial, sans-serif">
    <rect width="784" height="72" rx="18" fill="#211713" stroke="#ff9aad" stroke-opacity="0.42"/>
    <text x="26" y="44" font-size="20" font-weight="900" fill="#ffdfe5">frontmatter</text>
    <text x="260" y="44" font-size="15" fill="#b9aea3">name, description, allowed-tools</text>
    <rect y="96" width="784" height="72" rx="18" fill="#111817" stroke="#75e6c0" stroke-opacity="0.42"/>
    <text x="26" y="140" font-size="20" font-weight="900" fill="#c9fff0">instructions</text>
    <text x="260" y="140" font-size="15" fill="#b9aea3">steps, output format, guardrails</text>
    <rect y="192" width="378" height="72" rx="18" fill="#171313" stroke="#ffd27a" stroke-opacity="0.42"/>
    <text x="26" y="236" font-size="20" font-weight="900" fill="#ffe6ad">references/</text>
    <rect x="406" y="192" width="378" height="72" rx="18" fill="#101418" stroke="#7bd7ff" stroke-opacity="0.42"/>
    <text x="432" y="236" font-size="20" font-weight="900" fill="#d8f4ff">scripts/</text>
  </g>
</svg>
