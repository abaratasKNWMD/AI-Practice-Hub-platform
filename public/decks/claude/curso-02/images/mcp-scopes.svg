<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">MCP scopes</title>
  <desc id="desc">Local, project and user MCP scopes.</desc>
  <rect width="1100" height="620" rx="34" fill="#0d0b0a"/>
  <text x="95" y="112" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7f0">Scopes MCP</text>
  <g transform="translate(130 225)" font-family="Inter, Arial, sans-serif">
    <rect width="260" height="190" rx="26" fill="#111817" stroke="#75e6c0" stroke-opacity="0.45"/>
    <text x="130" y="72" text-anchor="middle" font-size="26" font-weight="900" fill="#c9fff0">local</text>
    <text x="130" y="112" text-anchor="middle" font-size="15" fill="#b9aea3">solo maquina</text>
