<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Context overhead meter</title>
  <desc id="desc">A context overhead meter showing memory, skills, agents and MCP.</desc>
  <rect width="1100" height="620" rx="34" fill="#0d0b0a"/>
  <text x="95" y="112" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7f0">Overhead de contexto</text>
  <g transform="translate(130 220)" font-family="Inter, Arial, sans-serif">
    <rect width="840" height="180" rx="24" fill="#15110f" stroke="#fff" stroke-opacity="0.12"/>
    <rect x="42" y="62" width="756" height="56" rx="28" fill="#0c0a09"/>
    <rect x="42" y="62" width="180" height="56" rx="28" fill="#75e6c0" fill-opacity="0.75"/>
    <rect x="222" y="62" width="160" height="56" fill="#ffd27a" fill-opacity="0.75"/>
    <rect x="382" y="62" width="190" height="56" fill="#ff9aad" fill-opacity="0.75"/>
    <rect x="572" y="62" width="120" height="56" fill="#7bd7ff" fill-opacity="0.75"/>
    <text x="132" y="98" text-anchor="middle" font-size="14" font-weight="900" fill="#09251d">memory</text>
    <text x="302" y="98" text-anchor="middle" font-size="14" font-weight="900" fill="#332409">skills</text>
    <text x="477" y="98" text-anchor="middle" font-size="14" font-weight="900" fill="#311018">agents</text>
    <text x="632" y="98" text-anchor="middle" font-size="14" font-weight="900" fill="#082435">MCP</text>
    <text x="420" y="154" text-anchor="middle" font-size="18" fill="#b9aea3">/context antes de cargar mas piezas</text>
  </g>
</svg>
