  <rect width="1000" height="560" rx="34" fill="#100f0e"/>
  <text x="500" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="850" fill="#fff4eb">SKILL.md no es enciclopedia</text>
  <rect x="220" y="142" width="560" height="330" rx="26" fill="#171311" stroke="rgba(255,255,255,.15)"/>
