<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Context window budget</title>
  <desc id="desc">Context window showing memory, tools, MCP and conversation competing for space.</desc>
  <rect width="1100" height="620" rx="34" fill="#0b0a09"/>
  <rect x="100" y="92" width="900" height="436" rx="28" fill="#15110f" stroke="#fff" stroke-opacity="0.12"/>
  <text x="136" y="148" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900" fill="#fff7f0">Ventana de contexto</text>
  <text x="136" y="182" font-family="Inter, Arial, sans-serif" font-size="18" fill="#b9aea3">Todo suma. Lo que no ayuda, distrae y cuesta.</text>
  <g transform="translate(136 235)" font-family="Inter, Arial, sans-serif">
    <rect width="828" height="90" rx="18" fill="#0c0a09" stroke="#fff" stroke-opacity="0.1"/>
    <rect width="210" height="90" rx="18" fill="#ff9aad" fill-opacity="0.2"/>
    <rect x="210" width="170" height="90" fill="#ffd27a" fill-opacity="0.18"/>
    <rect x="380" width="195" height="90" fill="#75e6c0" fill-opacity="0.16"/>
    <rect x="575" width="145" height="90" fill="#7bd7ff" fill-opacity="0.16"/>
    <rect x="720" width="108" height="90" rx="18" fill="#fff" fill-opacity="0.07"/>
    <text x="28" y="55" font-size="16" font-weight="800" fill="#ffdfe5">memoria</text>
    <text x="238" y="55" font-size="16" font-weight="800" fill="#ffe6ad">historial</text>
    <text x="410" y="55" font-size="16" font-weight="800" fill="#c9fff0">tools</text>
    <text x="610" y="55" font-size="16" font-weight="800" fill="#d8f4ff">MCP</text>
    <text x="748" y="55" font-size="16" font-weight="800" fill="#fff7f0">prompt</text>
  </g>
  <g transform="translate(136 370)" font-family="Inter, Arial, sans-serif">
    <rect width="255" height="78" rx="18" fill="#111817" stroke="#75e6c0" stroke-opacity="0.35"/>
    <text x="24" y="33" font-size="18" font-weight="800" fill="#c9fff0">Suficiente</text>
    <text x="24" y="58" font-size="14" fill="#b9aea3">Lo que decide el siguiente paso.</text>
    <rect x="286" width="255" height="78" rx="18" fill="#211713" stroke="#ff9aad" stroke-opacity="0.35"/>
    <text x="310" y="33" font-size="18" font-weight="800" fill="#ffdfe5">Excesivo</text>
    <text x="310" y="58" font-size="14" fill="#b9aea3">Ruido que arrastra la sesion.</text>
    <rect x="572" width="255" height="78" rx="18" fill="#171313" stroke="#ffd27a" stroke-opacity="0.35"/>
    <text x="596" y="33" font-size="18" font-weight="800" fill="#ffe6ad">Caducado</text>
    <text x="596" y="58" font-size="14" fill="#b9aea3">Tarea vieja que ya no aplica.</text>
  </g>
</svg>
