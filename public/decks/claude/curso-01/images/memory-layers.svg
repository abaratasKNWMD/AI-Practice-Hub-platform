<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude memory layers</title>
  <desc id="desc">Layered diagram of Claude memory sources.</desc>
  <rect width="1100" height="620" rx="34" fill="#0d0b0a"/>
  <text x="96" y="105" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7f0">Capas de memoria</text>
  <text x="96" y="140" font-family="Inter, Arial, sans-serif" font-size="18" fill="#b9aea3">Cada capa responde a una pregunta distinta.</text>
  <g transform="translate(170 200)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="280" width="760" height="70" rx="18" fill="#211713" stroke="#ff9aad" stroke-opacity="0.42"/>
    <text x="32" y="324" font-size="21" font-weight="800" fill="#ffdfe5">CLAUDE.md</text>
    <text x="260" y="324" font-size="15" fill="#b9aea3">contexto estable de equipo</text>
    <rect x="45" y="210" width="670" height="70" rx="18" fill="#171313" stroke="#ffd27a" stroke-opacity="0.42"/>
    <text x="77" y="254" font-size="21" font-weight="800" fill="#ffe6ad">rules por carpeta</text>
    <text x="330" y="254" font-size="15" fill="#b9aea3">criterio especifico por area</text>
    <rect x="90" y="140" width="580" height="70" rx="18" fill="#111817" stroke="#75e6c0" stroke-opacity="0.42"/>
    <text x="122" y="184" font-size="21" font-weight="800" fill="#c9fff0">auto memory</text>
    <text x="330" y="184" font-size="15" fill="#b9aea3">aprendizajes locales auditables</text>
    <rect x="135" y="70" width="490" height="70" rx="18" fill="#101418" stroke="#7bd7ff" stroke-opacity="0.42"/>
    <text x="167" y="114" font-size="21" font-weight="800" fill="#d8f4ff">skills</text>
    <text x="300" y="114" font-size="15" fill="#b9aea3">procedimientos bajo demanda</text>
    <rect x="180" y="0" width="400" height="70" rx="18" fill="#181310" stroke="#fff" stroke-opacity="0.16"/>
    <text x="212" y="44" font-size="21" font-weight="800" fill="#fff7f0">prompt</text>
    <text x="330" y="44" font-size="15" fill="#b9aea3">tarea puntual</text>
  </g>
</svg>
