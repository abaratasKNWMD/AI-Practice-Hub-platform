<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline prompt plan evidencia</title>
  <desc id="desc">Flujo visual de prompt operativo, plan corto, patch pequeno y evidencia de cierre.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7efe5"/>
      <stop offset="1" stop-color="#e3f0ea"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" rx="38" fill="url(#bg)"/>
  <text x="72" y="84" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#211914">De prompt a evidencia</text>
  <text x="72" y="121" font-family="Inter, Arial, sans-serif" font-size="21" fill="#665544">La calidad no esta en pedir mucho. Esta en cerrar con pruebas y riesgos claros.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="76" y="220" width="244" height="190" rx="26" fill="#fffaf2" stroke="#d1b48f" stroke-width="2"/>
    <text x="198" y="268" text-anchor="middle" font-size="26" font-weight="900" fill="#251c15">1 Prompt</text>
    <text x="198" y="310" text-anchor="middle" font-size="17" fill="#665544">objetivo</text>
    <text x="198" y="338" text-anchor="middle" font-size="17" fill="#665544">alcance</text>
    <text x="198" y="366" text-anchor="middle" font-size="17" fill="#665544">prohibiciones</text>
    <rect x="384" y="220" width="244" height="190" rx="26" fill="#f1f8f4" stroke="#9dbfac" stroke-width="2"/>
    <text x="506" y="268" text-anchor="middle" font-size="26" font-weight="900" fill="#251c15">2 Plan</text>
    <text x="506" y="310" text-anchor="middle" font-size="17" fill="#665544">2-4 pasos</text>
    <text x="506" y="338" text-anchor="middle" font-size="17" fill="#665544">archivos</text>
    <text x="506" y="366" text-anchor="middle" font-size="17" fill="#665544">check barato</text>
    <rect x="692" y="220" width="244" height="190" rx="26" fill="#fff1dc" stroke="#dfaa66" stroke-width="2"/>
    <text x="814" y="268" text-anchor="middle" font-size="26" font-weight="900" fill="#251c15">3 Patch</text>
    <text x="814" y="310" text-anchor="middle" font-size="17" fill="#665544">minimo</text>
    <text x="814" y="338" text-anchor="middle" font-size="17" fill="#665544">reversible</text>
    <text x="814" y="366" text-anchor="middle" font-size="17" fill="#665544">sin sorpresa</text>
    <rect x="1000" y="220" width="244" height="190" rx="26" fill="#1f1f1f" stroke="#1f1f1f" stroke-width="2"/>
    <text x="1122" y="268" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">4 Evidencia</text>
    <text x="1122" y="310" text-anchor="middle" font-size="17" fill="#eedfce">diff</text>
    <text x="1122" y="338" text-anchor="middle" font-size="17" fill="#eedfce">tests</text>
    <text x="1122" y="366" text-anchor="middle" font-size="17" fill="#eedfce">riesgos</text>
  </g>
  <g stroke="#43352a" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M326 315 H374"/>
    <path d="M634 315 H682"/>
    <path d="M942 315 H990"/>
  </g>
  <g fill="#43352a">
    <path d="M374 315 l-16 -10 v20 Z"/>
    <path d="M682 315 l-16 -10 v20 Z"/>
    <path d="M990 315 l-16 -10 v20 Z"/>
  </g>
  <rect x="208" y="512" width="864" height="78" rx="22" fill="#ffffff" opacity="0.84"/>
  <text x="640" y="545" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="900" fill="#241b14">Contrato del curso</text>
  <text x="640" y="576" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f4d3c">Claude no termina cuando escribe codigo. Termina cuando deja evidencia legible.</text>
</svg>
