<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Radar de inventario MCP</title>
  <desc id="desc">Visual para auditar MCPs por owner, permisos, datos y coste antes de conectarlos a Claude.</desc>
  <rect width="1280" height="720" rx="38" fill="#eef5f2"/>
  <text x="74" y="84" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#18231f">Radar MCP</text>
  <text x="74" y="121" font-family="Inter, Arial, sans-serif" font-size="21" fill="#50645d">MCP no se instala por curiosidad: se inventaria como cualquier integracion seria.</text>
  <g transform="translate(440 380)">
    <circle r="236" fill="#ffffff" opacity="0.72"/>
    <circle r="186" fill="none" stroke="#92aaa2" stroke-width="2"/>
    <circle r="126" fill="none" stroke="#92aaa2" stroke-width="2"/>
    <circle r="66" fill="none" stroke="#92aaa2" stroke-width="2"/>
    <line x1="-236" y1="0" x2="236" y2="0" stroke="#92aaa2" stroke-width="2"/>
    <line x1="0" y1="-236" x2="0" y2="236" stroke="#92aaa2" stroke-width="2"/>
    <path d="M0 0 L140 -78 A160 160 0 0 1 152 48 Z" fill="#e9c46a" opacity="0.68"/>
    <circle cx="-86" cy="-112" r="14" fill="#2a9d8f"/>
    <circle cx="126" cy="-66" r="14" fill="#e9c46a"/>
    <circle cx="154" cy="82" r="14" fill="#e76f51"/>
    <circle cx="-42" cy="58" r="14" fill="#2a9d8f"/>
    <text y="8" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#1e2925">Claude</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" fill="#1f2a26">
    <rect x="770" y="180" width="370" height="72" rx="18" fill="#fff"/>
    <text x="802" y="212" font-size="22" font-weight="900">Owner</text>
    <text x="802" y="239" font-size="17">quien mantiene y quien aprueba</text>
    <rect x="770" y="274" width="370" height="72" rx="18" fill="#fff"/>
    <text x="802" y="306" font-size="22" font-weight="900">Permisos</text>
    <text x="802" y="333" font-size="17">readonly primero, write con motivo</text>
    <rect x="770" y="368" width="370" height="72" rx="18" fill="#fff"/>
    <text x="802" y="400" font-size="22" font-weight="900">Datos</text>
    <text x="802" y="427" font-size="17">PII, secretos, cliente, logs, repo</text>
    <rect x="770" y="462" width="370" height="72" rx="18" fill="#fff"/>
    <text x="802" y="494" font-size="22" font-weight="900">Coste y contexto</text>
    <text x="802" y="521" font-size="17">cuanto mete en cada tarea</text>
  </g>
  <rect x="86" y="626" width="1074" height="48" rx="16" fill="#17221e"/>
  <text x="623" y="657" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="900" fill="#fff">Pregunta clave: que decision desbloquea este MCP que Claude no puede resolver leyendo el repo?</text>
</svg>
