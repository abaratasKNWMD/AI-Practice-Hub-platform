<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">First Claude task loop</title>
  <desc id="desc">A loop showing map, plan, patch, verify and handoff.</desc>
  <rect width="1100" height="620" rx="34" fill="#0b0a09"/>
  <text x="105" y="112" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7f0">Primer flujo real</text>
  <text x="105" y="148" font-family="Inter, Arial, sans-serif" font-size="18" fill="#b9aea3">Explorar, planificar, editar poco, verificar y cerrar.</text>
  <g transform="translate(160 228)" font-family="Inter, Arial, sans-serif">
    <path d="M160 70H345M505 70H690M780 150C780 250 640 300 470 300C300 300 160 250 160 150" fill="none" stroke="#75e6c0" stroke-width="5" stroke-linecap="round" stroke-dasharray="7 14"/>
    <g transform="translate(0 0)">
      <rect width="160" height="120" rx="22" fill="#111817" stroke="#75e6c0" stroke-opacity="0.45"/>
      <text x="80" y="54" text-anchor="middle" font-size="21" font-weight="900" fill="#c9fff0">Mapa</text>
      <text x="80" y="84" text-anchor="middle" font-size="14" fill="#b9aea3">solo lectura</text>
    </g>
    <g transform="translate(345 0)">
      <rect width="160" height="120" rx="22" fill="#171313" stroke="#ffd27a" stroke-opacity="0.45"/>
      <text x="80" y="54" text-anchor="middle" font-size="21" font-weight="900" fill="#ffe6ad">Plan</text>
      <text x="80" y="84" text-anchor="middle" font-size="14" fill="#b9aea3">3 pasos</text>
    </g>
    <g transform="translate(690 0)">
      <rect width="160" height="120" rx="22" fill="#211713" stroke="#ff9aad" stroke-opacity="0.45"/>
      <text x="80" y="54" text-anchor="middle" font-size="21" font-weight="900" fill="#ffdfe5">Patch</text>
      <text x="80" y="84" text-anchor="middle" font-size="14" fill="#b9aea3">minimo</text>
    </g>
    <g transform="translate(520 250)">
      <rect width="160" height="120" rx="22" fill="#101418" stroke="#7bd7ff" stroke-opacity="0.45"/>
      <text x="80" y="54" text-anchor="middle" font-size="21" font-weight="900" fill="#d8f4ff">Test</text>
      <text x="80" y="84" text-anchor="middle" font-size="14" fill="#b9aea3">check barato</text>
    </g>
    <g transform="translate(170 250)">
      <rect width="160" height="120" rx="22" fill="#181310" stroke="#fff" stroke-opacity="0.18"/>
      <text x="80" y="54" text-anchor="middle" font-size="21" font-weight="900" fill="#fff7f0">Handoff</text>
      <text x="80" y="84" text-anchor="middle" font-size="14" fill="#b9aea3">evidencia</text>
    </g>
  </g>
</svg>
