<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude surface map</title>
  <desc id="desc">Claude Code surfaces connected by a workflow line.</desc>
  <rect width="1100" height="620" rx="34" fill="#0d0b0a"/>
  <rect x="70" y="72" width="960" height="476" rx="30" fill="#15110f" stroke="#fff" stroke-opacity="0.12"/>
  <text x="96" y="124" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#fff7f0">Elige superficie antes de prompt</text>
  <text x="96" y="157" font-family="Inter, Arial, sans-serif" font-size="17" fill="#b9aea3">Cada entrada cambia contexto, permisos y responsabilidad.</text>
  <g font-family="Inter, Arial, sans-serif">
    <path d="M220 318H882" stroke="#75e6c0" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 16"/>
    <g transform="translate(120 230)">
      <rect width="170" height="170" rx="24" fill="#211713" stroke="#ff9aad" stroke-opacity="0.45"/>
      <text x="85" y="70" text-anchor="middle" font-size="25" font-weight="800" fill="#ffdfe5">CLI</text>
      <text x="85" y="105" text-anchor="middle" font-size="14" fill="#b9aea3">trabajo fino</text>
    </g>
    <g transform="translate(310 230)">
      <rect width="170" height="170" rx="24" fill="#111817" stroke="#75e6c0" stroke-opacity="0.45"/>
      <text x="85" y="70" text-anchor="middle" font-size="25" font-weight="800" fill="#c9fff0">IDE</text>
      <text x="85" y="105" text-anchor="middle" font-size="14" fill="#b9aea3">diff visual</text>
    </g>
    <g transform="translate(500 230)">
      <rect width="170" height="170" rx="24" fill="#171313" stroke="#ffd27a" stroke-opacity="0.45"/>
      <text x="85" y="70" text-anchor="middle" font-size="25" font-weight="800" fill="#ffe6ad">Web</text>
      <text x="85" y="105" text-anchor="middle" font-size="14" fill="#b9aea3">sesion larga</text>
    </g>
    <g transform="translate(690 230)">
      <rect width="170" height="170" rx="24" fill="#101418" stroke="#7bd7ff" stroke-opacity="0.45"/>
      <text x="85" y="70" text-anchor="middle" font-size="25" font-weight="800" fill="#d8f4ff">CI/CD</text>
      <text x="85" y="105" text-anchor="middle" font-size="14" fill="#b9aea3">gobierno</text>
    </g>
    <g transform="translate(880 230)">
      <rect width="100" height="170" rx="24" fill="#191512" stroke="#fff" stroke-opacity="0.16"/>
      <text x="50" y="72" text-anchor="middle" font-size="22" font-weight="800" fill="#fff7f0">SDK</text>
      <text x="50" y="105" text-anchor="middle" font-size="13" fill="#b9aea3">producto</text>
    </g>
