<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code Core cockpit</title>
  <desc id="desc">A dark cockpit view with Claude memory, tools, permissions and cost panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17100d"/>
      <stop offset="0.5" stop-color="#0d1211"/>
      <stop offset="1" stop-color="#211713"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#ff9aad"/>
      <stop offset="1" stop-color="#75e6c0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1100" height="620" rx="34" fill="url(#bg)"/>
  <g opacity="0.25" stroke="#fff" stroke-width="1">
    <path d="M60 90H1040M60 170H1040M60 250H1040M60 330H1040M60 410H1040M60 490H1040"/>
    <path d="M140 50V570M260 50V570M380 50V570M500 50V570M620 50V570M740 50V570M860 50V570M980 50V570"/>
  </g>
  <rect x="90" y="78" width="920" height="470" rx="28" fill="#0c0a09" stroke="#ffffff" stroke-opacity="0.12" filter="url(#shadow)"/>
  <rect x="90" y="78" width="920" height="56" rx="28" fill="#191512"/>
  <circle cx="124" cy="106" r="8" fill="#ff6b75"/>
  <circle cx="150" cy="106" r="8" fill="#ffd166"/>
  <circle cx="176" cy="106" r="8" fill="#75e6c0"/>
  <text x="550" y="113" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#7e746b">claude.code.core</text>
  <rect x="126" y="168" width="350" height="328" rx="22" fill="#14110f" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="154" y="206" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#fff7f0">CLAUDE.md</text>
  <text x="154" y="242" font-family="Inter, Arial, sans-serif" font-size="17" fill="#b9aea3">Memoria estable, no prompt gigante.</text>
  <rect x="154" y="276" width="278" height="34" rx="10" fill="#ff9aad" fill-opacity="0.16"/>
  <text x="174" y="299" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#ffdfe5">/context before tool sprawl</text>
  <rect x="154" y="326" width="248" height="34" rx="10" fill="#75e6c0" fill-opacity="0.14"/>
  <text x="174" y="349" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#c9fff0">plan before patch</text>
  <rect x="154" y="376" width="304" height="34" rx="10" fill="#ffd27a" fill-opacity="0.13"/>
  <text x="174" y="399" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#ffe6ad">close with checks + risks</text>
  <g transform="translate(532 168)">
    <rect width="410" height="78" rx="18" fill="#14110f" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="28" y="33" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff7f0">Tools</text>
    <text x="28" y="58" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b9aea3">Read, edit, run, MCP, GitHub Actions.</text>
    <rect x="298" y="22" width="84" height="34" rx="17" fill="#75e6c0" fill-opacity="0.18"/>
    <text x="340" y="44" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#bfffe9">scoped</text>
  </g>
  <g transform="translate(532 270)">
    <rect width="410" height="78" rx="18" fill="#14110f" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="28" y="33" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff7f0">Permissions</text>
    <text x="28" y="58" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b9aea3">Approve impact, not vibes.</text>
    <rect x="298" y="22" width="84" height="34" rx="17" fill="#ff9aad" fill-opacity="0.2"/>
    <text x="340" y="44" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffdfe5">review</text>
  </g>
  <g transform="translate(532 372)">
    <rect width="410" height="78" rx="18" fill="#14110f" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="28" y="33" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff7f0">Cost</text>
    <text x="28" y="58" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b9aea3">Model, context, tools and rework.</text>
    <rect x="298" y="22" width="84" height="34" rx="17" fill="#ffd27a" fill-opacity="0.18"/>
    <text x="340" y="44" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffe6ad">budget</text>
  </g>
  <path d="M476 318C506 318 506 207 532 207M476 318C507 318 507 309 532 309M476 318C506 318 506 411 532 411" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
