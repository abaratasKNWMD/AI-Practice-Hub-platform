<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">PR guardrails</title>
  <desc id="desc">Guardrails for PR automation including trigger, actor, permission and budget.</desc>
  <rect width="1100" height="620" rx="34" fill="#0d0b0a"/>
  <text x="95" y="112" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7f0">Guardrails de PR</text>
  <g transform="translate(150 215)" font-family="Inter, Arial, sans-serif">
    <rect width="800" height="250" rx="28" fill="#15110f" stroke="#fff" stroke-opacity="0.12"/>
    <rect x="42" y="58" width="150" height="62" rx="18" fill="#111817" stroke="#75e6c0" stroke-opacity="0.42"/>
    <text x="117" y="96" text-anchor="middle" font-size="16" font-weight="900" fill="#c9fff0">label</text>
    <rect x="232" y="58" width="150" height="62" rx="18" fill="#171313" stroke="#ffd27a" stroke-opacity="0.42"/>
    <text x="307" y="96" text-anchor="middle" font-size="16" font-weight="900" fill="#ffe6ad">actor</text>
    <rect x="422" y="58" width="150" height="62" rx="18" fill="#211713" stroke="#ff9aad" stroke-opacity="0.42"/>
    <text x="497" y="96" text-anchor="middle" font-size="16" font-weight="900" fill="#ffdfe5">permissions</text>
    <rect x="612" y="58" width="150" height="62" rx="18" fill="#101418" stroke="#7bd7ff" stroke-opacity="0.42"/>
    <text x="687" y="96" text-anchor="middle" font-size="16" font-weight="900" fill="#d8f4ff">budget</text>
    <text x="400" y="190" text-anchor="middle" font-size="18" fill="#b9aea3">Sin estas cuatro puertas, no se invoca Claude en CI.</text>
  </g>
</svg>
