<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Big automate button meme</title>
  <desc id="desc">Meme about automating everything too soon.</desc>
  <rect width="1000" height="560" rx="34" fill="#11100f"/>
  <text x="500" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="850" fill="#fff4eb">El boton de automatizar todo</text>
  <circle cx="500" cy="280" r="132" fill="#301015" stroke="#ff9aad" stroke-width="10"/>
  <circle cx="500" cy="280" r="92" fill="#ff9aad"/>
  <text x="500" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="850" fill="#2b0f15">AUTO</text>
  <text x="500" y="314" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="850" fill="#2b0f15">TODO</text>
  <text x="500" y="478" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850" fill="#d8fff1">Automatiza lo que entiendes. Mide lo que automatizas.</text>
