<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude Advanced Automation hero</title>
  <desc id="desc">Automation control panel with hooks, plugins, GitHub Actions and cost.</desc>
  <rect width="1100" height="620" rx="34" fill="#0b0a09"/>
  <rect x="78" y="72" width="944" height="476" rx="30" fill="#15110f" stroke="#fff" stroke-opacity="0.12"/>
  <text x="112" y="128" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7f0">Advanced Automation</text>
  <text x="112" y="164" font-family="Inter, Arial, sans-serif" font-size="18" fill="#b9aea3">Automatizacion con carriles, no autonomia invisible.</text>
  <g transform="translate(120 235)" font-family="Inter, Arial, sans-serif">
    <rect width="190" height="160" rx="24" fill="#211713" stroke="#ff9aad" stroke-opacity="0.45"/>
    <text x="95" y="90" text-anchor="middle" font-size="25" font-weight="900" fill="#ffdfe5">Hooks</text>
    <rect x="225" width="190" height="160" rx="24" fill="#111817" stroke="#75e6c0" stroke-opacity="0.45"/>
    <text x="320" y="90" text-anchor="middle" font-size="25" font-weight="900" fill="#c9fff0">Plugins</text>
    <rect x="450" width="230" height="160" rx="24" fill="#171313" stroke="#ffd27a" stroke-opacity="0.45"/>
    <text x="565" y="90" text-anchor="middle" font-size="25" font-weight="900" fill="#ffe6ad">Actions</text>
    <rect x="715" width="190" height="160" rx="24" fill="#101418" stroke="#7bd7ff" stroke-opacity="0.45"/>
    <text x="810" y="90" text-anchor="middle" font-size="25" font-weight="900" fill="#d8f4ff">Cost</text>
  </g>
</svg>
