<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Automation map</title>
  <desc id="desc">Stack of Claude advanced automation components.</desc>
  <rect width="1100" height="620" rx="34" fill="#0d0b0a"/>
  <text x="95" y="110" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7f0">Arquitectura Advanced</text>
  <g transform="translate(190 190)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="260" width="720" height="70" rx="20" fill="#211713" stroke="#ff9aad" stroke-opacity="0.42"/>
    <text x="36" y="304" font-size="21" font-weight="900" fill="#ffdfe5">Hooks</text>
    <text x="210" y="304" font-size="15" fill="#b9aea3">bloquear, validar, exigir evidencia</text>
    <rect x="40" y="175" width="640" height="70" rx="20" fill="#111817" stroke="#75e6c0" stroke-opacity="0.42"/>
    <text x="76" y="219" font-size="21" font-weight="900" fill="#c9fff0">Plugins</text>
    <text x="250" y="219" font-size="15" fill="#b9aea3">distribuir skills, agents y hooks</text>
    <rect x="80" y="90" width="560" height="70" rx="20" fill="#171313" stroke="#ffd27a" stroke-opacity="0.42"/>
    <text x="116" y="134" font-size="21" font-weight="900" fill="#ffe6ad">GitHub Actions</text>
    <text x="350" y="134" font-size="15" fill="#b9aea3">review de PR con permisos minimos</text>
    <rect x="120" y="5" width="480" height="70" rx="20" fill="#101418" stroke="#7bd7ff" stroke-opacity="0.42"/>
    <text x="156" y="49" font-size="21" font-weight="900" fill="#d8f4ff">Governance</text>
    <text x="350" y="49" font-size="15" fill="#b9aea3">coste, owner, rollback</text>
  </g>
</svg>
