<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Action flow</title>
  <desc id="desc">Claude GitHub Action flow from PR to review comment.</desc>
  <rect width="1000" height="560" rx="34" fill="#0e1112"/>
  <text x="500" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="850" fill="#fff4eb">Claude en GitHub Actions</text>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="120" y="220" width="180" height="130" rx="24" fill="#171311" stroke="#7bd7ff"/>
    <text x="210" y="292" font-size="22" font-weight="850" fill="#dff7ff">PR</text>
    <rect x="410" y="200" width="180" height="170" rx="24" fill="#171311" stroke="#ffd27a"/>
    <text x="500" y="292" font-size="22" font-weight="850" fill="#fff0c9">Action</text>
    <rect x="700" y="220" width="180" height="130" rx="24" fill="#171311" stroke="#75e6c0"/>
    <text x="790" y="292" font-size="22" font-weight="850" fill="#d8fff1">Comment</text>
  </g>
  <path d="M300 285H410M590 285H700" stroke="#75e6c0" stroke-width="6" stroke-linecap="round"/>
  <text x="500" y="460" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" fill="#fff4eb">Permisos minimos. Secretos en GitHub Secrets. Revision humana.</text>
</svg>
