<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Rollout ring de plugins Claude</title>
  <desc id="desc">Diagrama de rollout por anillos: sandbox, piloto, equipo y organizacion.</desc>
  <rect width="1280" height="720" rx="36" fill="#eef5f2"/>
  <text x="74" y="86" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#17221e">Rollout por anillos</text>
  <text x="74" y="124" font-family="Inter, Arial, sans-serif" font-size="21" fill="#52675f">Los plugins se despliegan como producto interno, no como archivo compartido en un chat.</text>
  <circle cx="640" cy="390" r="238" fill="#d1fae5"/>
  <circle cx="640" cy="390" r="178" fill="#bbf7d0"/>
  <circle cx="640" cy="390" r="118" fill="#a7f3d0"/>
  <circle cx="640" cy="390" r="58" fill="#1f1f1f"/>
  <g font-family="Inter, Arial, sans-serif" font-weight="900">
    <text x="640" y="398" text-anchor="middle" font-size="20" fill="#fff">plugin</text>
    <text x="640" y="292" text-anchor="middle" font-size="22" fill="#064e3b">sandbox</text>
    <text x="640" y="226" text-anchor="middle" font-size="22" fill="#064e3b">piloto</text>
    <text x="640" y="164" text-anchor="middle" font-size="22" fill="#064e3b">equipo</text>
    <text x="640" y="98" text-anchor="middle" font-size="22" fill="#064e3b">organizacion</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="18" fill="#17221e">
    <rect x="72" y="246" width="310" height="78" rx="18" fill="#fff"/>
    <text x="106" y="278" font-weight="900">Gate 1</text>
    <text x="106" y="306">tests + rollback</text>
    <rect x="898" y="300" width="310" height="78" rx="18" fill="#fff"/>
    <text x="932" y="332" font-weight="900">Gate 2</text>
    <text x="932" y="360">owner + changelog</text>
    <rect x="72" y="500" width="310" height="78" rx="18" fill="#fff"/>
    <text x="106" y="532" font-weight="900">Gate 3</text>
    <text x="106" y="560">cost report</text>
    <rect x="898" y="510" width="310" height="78" rx="18" fill="#fff"/>
    <text x="932" y="542" font-weight="900">Gate 4</text>
    <text x="932" y="570">support model</text>
  </g>
</svg>
