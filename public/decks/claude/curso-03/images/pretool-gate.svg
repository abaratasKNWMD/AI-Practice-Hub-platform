<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">PreToolUse gate</title>
  <desc id="desc">PreToolUse hook blocks risky tool calls.</desc>
  <rect width="1100" height="620" rx="34" fill="#0d0b0a"/>
  <text x="95" y="112" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7f0">PreToolUse gate</text>
  <g transform="translate(130 220)" font-family="Inter, Arial, sans-serif">
    <rect width="250" height="190" rx="26" fill="#211713" stroke="#ff9aad" stroke-opacity="0.45"/>
    <text x="125" y="82" text-anchor="middle" font-size="24" font-weight="900" fill="#ffdfe5">Tool call</text>
    <text x="125" y="120" text-anchor="middle" font-size="15" fill="#b9aea3">Write(.env)</text>
    <path d="M282 95H430" stroke="#ffd27a" stroke-width="6" stroke-linecap="round"/>
    <rect x="460" width="230" height="190" rx="26" fill="#171313" stroke="#ffd27a" stroke-opacity="0.45"/>
    <text x="575" y="82" text-anchor="middle" font-size="24" font-weight="900" fill="#ffe6ad">Hook</text>
    <text x="575" y="120" text-anchor="middle" font-size="15" fill="#b9aea3">policy check</text>
    <path d="M720 95H830" stroke="#ff9aad" stroke-width="6" stroke-linecap="round"/>
    <rect x="850" width="170" height="190" rx="26" fill="#181310" stroke="#ff9aad" stroke-opacity="0.45"/>
    <text x="935" y="84" text-anchor="middle" font-size="24" font-weight="900" fill="#ffdfe5">Block</text>
    <text x="935" y="120" text-anchor="middle" font-size="15" fill="#b9aea3">reason</text>
  </g>
</svg>
