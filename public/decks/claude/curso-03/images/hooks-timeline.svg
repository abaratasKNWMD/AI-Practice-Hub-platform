      <circle cx="670" cy="80" r="34" fill="#101418" stroke="#7bd7ff" stroke-width="4"/>
      <text x="670" y="146" text-anchor="middle" font-size="15" font-weight="900" fill="#d8f4ff">Stop</text>
      <circle cx="860" cy="80" r="34" fill="#181310" stroke="#fff" stroke-width="4" stroke-opacity="0.22"/>
