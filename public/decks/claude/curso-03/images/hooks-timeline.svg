<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Hooks timeline</title>
  <desc id="desc">Timeline of Claude hook events.</desc>
  <rect width="1100" height="620" rx="34" fill="#0b0a09"/>
  <text x="95" y="110" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7f0">Eventos de hook</text>
  <g transform="translate(120 260)" font-family="Inter, Arial, sans-serif">
    <path d="M70 80H860" stroke="#75e6c0" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 14"/>
    <g>
      <circle cx="70" cy="80" r="34" fill="#211713" stroke="#ff9aad" stroke-width="4"/>
      <text x="70" y="146" text-anchor="middle" font-size="15" font-weight="900" fill="#ffdfe5">PreToolUse</text>
      <circle cx="270" cy="80" r="34" fill="#171313" stroke="#ffd27a" stroke-width="4"/>
      <text x="270" y="146" text-anchor="middle" font-size="15" font-weight="900" fill="#ffe6ad">PostToolUse</text>
