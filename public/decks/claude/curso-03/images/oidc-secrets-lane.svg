<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Carril de secretos y OIDC</title>
  <desc id="desc">Diagrama para separar PR automation de secretos, OIDC y permisos temporales.</desc>
  <rect width="1280" height="720" rx="36" fill="#eef5f2"/>
  <text x="72" y="86" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#17221e">Secrets lane</text>
  <text x="72" y="124" font-family="Inter, Arial, sans-serif" font-size="21" fill="#52675f">La Action no hereda llaves por comodidad: pide permisos temporales y auditables.</text>
  <g font-family="Inter, Arial, sans-serif" font-weight="900" fill="#17221e">
    <rect x="84" y="246" width="236" height="110" rx="24" fill="#fff"/>
    <text x="202" y="310" text-anchor="middle" font-size="24">PR event</text>
    <rect x="388" y="246" width="236" height="110" rx="24" fill="#bbf7d0"/>
    <text x="506" y="310" text-anchor="middle" font-size="24">OIDC token</text>
    <rect x="692" y="246" width="236" height="110" rx="24" fill="#fde68a"/>
    <text x="810" y="294" text-anchor="middle" font-size="24">temporary</text>
    <text x="810" y="326" text-anchor="middle" font-size="24">credentials</text>
    <rect x="996" y="246" width="200" height="110" rx="24" fill="#fecaca"/>
    <text x="1096" y="310" text-anchor="middle" font-size="24">vault</text>
  </g>
  <g stroke="#34443e" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M320 302 H388"/>
    <path d="M624 302 H692"/>
    <path d="M928 302 H996"/>
  </g>
  <rect x="260" y="484" width="760" height="76" rx="22" fill="#17221e"/>
  <text x="640" y="532" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="900" fill="#fff">No poner secretos en contexto. No pasar secretos por prompt. No loggear secretos.</text>
</svg>
