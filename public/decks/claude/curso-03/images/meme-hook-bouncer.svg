<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Hook bouncer meme</title>
  <desc id="desc">Meme about hooks that block too much.</desc>
  <rect width="1000" height="560" rx="34" fill="#11100f"/>
  <text x="500" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="850" fill="#fff4eb">Hook con complejo de portero</text>
  <rect x="250" y="160" width="500" height="270" rx="30" fill="#171311" stroke="#ff9aad" stroke-width="5"/>
  <rect x="450" y="160" width="100" height="270" fill="#241a16"/>
  <text x="500" y="300" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="850" fill="#ffdfe5">NO</text>
  <text x="500" y="486" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850" fill="#d8fff1">Buen hook: especifico, explicable y reversible.</text>
</svg>
