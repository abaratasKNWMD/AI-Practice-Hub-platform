<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Autopilot meme</title>
  <desc id="desc">Humorous warning about automation without verification.</desc>
  <rect width="1100" height="620" rx="34" fill="#11100f"/>
  <text x="95" y="112" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7f0">Piloto automatico sin check</text>
  <text x="95" y="148" font-family="Inter, Arial, sans-serif" font-size="18" fill="#b9aea3">Cerrar los ojos con mas YAML sigue siendo cerrar los ojos.</text>
  <g transform="translate(150 220)" font-family="Inter, Arial, sans-serif">
    <rect width="360" height="220" rx="28" fill="#211713" stroke="#ff9aad" stroke-opacity="0.42"/>
    <text x="180" y="95" text-anchor="middle" font-size="24" font-weight="900" fill="#ffdfe5">AUTO</text>
    <text x="180" y="132" text-anchor="middle" font-size="16" fill="#b9aea3">sin evidencia</text>
    <rect x="460" width="360" height="220" rx="28" fill="#111817" stroke="#75e6c0" stroke-opacity="0.42"/>
    <text x="640" y="95" text-anchor="middle" font-size="24" font-weight="900" fill="#c9fff0">AUTO + CHECK</text>
    <text x="640" y="132" text-anchor="middle" font-size="16" fill="#b9aea3">diff + tests + riesgos</text>
  </g>
</svg>
