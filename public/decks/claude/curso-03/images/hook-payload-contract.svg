<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Contrato de payload de hooks Claude</title>
  <desc id="desc">Diagrama de payload de hook con tool, args, decision y salida estructurada.</desc>
  <rect width="1280" height="720" rx="36" fill="#f7efe5"/>
  <text x="72" y="86" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#211914">Hook payload contract</text>
  <text x="72" y="124" font-family="Inter, Arial, sans-serif" font-size="21" fill="#6a5847">Un hook bueno no adivina: lee payload, decide y devuelve salida estable.</text>
  <rect x="82" y="190" width="344" height="392" rx="26" fill="#1f1f1f"/>
  <text x="116" y="236" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#fff">input</text>
  <text x="116" y="282" font-family="Geist Mono, Consolas, monospace" font-size="20" fill="#d9f99d">{</text>
  <text x="142" y="320" font-family="Geist Mono, Consolas, monospace" font-size="20" fill="#bfdbfe">"tool": "Read",</text>
  <text x="142" y="358" font-family="Geist Mono, Consolas, monospace" font-size="20" fill="#bfdbfe">"path": ".env",</text>
  <text x="142" y="396" font-family="Geist Mono, Consolas, monospace" font-size="20" fill="#bfdbfe">"session": "pr-42"</text>
  <text x="116" y="434" font-family="Geist Mono, Consolas, monospace" font-size="20" fill="#d9f99d">}</text>
  <rect x="468" y="252" width="344" height="260" rx="30" fill="#f4d58d"/>
  <text x="640" y="316" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900" fill="#211914">decision</text>
  <text x="640" y="370" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#4d3928">allow / block / ask</text>
  <text x="640" y="420" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6a4d32">con razon legible</text>
  <rect x="854" y="190" width="344" height="392" rx="26" fill="#17221e"/>
  <text x="888" y="236" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#fff">output</text>
  <text x="888" y="282" font-family="Geist Mono, Consolas, monospace" font-size="20" fill="#bbf7d0">{</text>
  <text x="914" y="320" font-family="Geist Mono, Consolas, monospace" font-size="20" fill="#fecaca">"allow": false,</text>
  <text x="914" y="358" font-family="Geist Mono, Consolas, monospace" font-size="20" fill="#fecaca">"reason": "secret path",</text>
  <text x="914" y="396" font-family="Geist Mono, Consolas, monospace" font-size="20" fill="#fecaca">"hint": "use vault MCP"</text>
  <text x="888" y="434" font-family="Geist Mono, Consolas, monospace" font-size="20" fill="#bbf7d0">}</text>
  <path d="M426 386 H468" stroke="#3d3026" stroke-width="6" stroke-linecap="round"/>
  <path d="M812 386 H854" stroke="#3d3026" stroke-width="6" stroke-linecap="round"/>
  <text x="640" y="650" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#211914">Si no puedes probar el contrato, no esta listo para rollout.</text>
</svg>
