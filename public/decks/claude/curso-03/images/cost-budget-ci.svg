<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Budget de coste CI Claude</title>
  <desc id="desc">Dashboard de presupuesto CI por PR, label, modelo y reintentos.</desc>
  <rect width="1280" height="720" rx="36" fill="#f7efe5"/>
  <text x="74" y="86" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#211914">CI cost budget</text>
  <text x="74" y="124" font-family="Inter, Arial, sans-serif" font-size="21" fill="#6a5847">En CI, una mala label puede multiplicar gasto. El budget debe vivir en el workflow.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="86" y="196" width="250" height="170" rx="24" fill="#fffaf2" stroke="#d8bc95"/>
    <text x="126" y="246" font-size="20" font-weight="900" fill="#6a5847">por PR</text>
    <text x="126" y="310" font-size="54" font-weight="900" fill="#211914">€0.40</text>
    <rect x="374" y="196" width="250" height="170" rx="24" fill="#fffaf2" stroke="#d8bc95"/>
    <text x="414" y="246" font-size="20" font-weight="900" fill="#6a5847">max reintentos</text>
    <text x="414" y="310" font-size="54" font-weight="900" fill="#211914">2</text>
    <rect x="662" y="196" width="250" height="170" rx="24" fill="#fffaf2" stroke="#d8bc95"/>
    <text x="702" y="246" font-size="20" font-weight="900" fill="#6a5847">modelo</text>
    <text x="702" y="310" font-size="42" font-weight="900" fill="#211914">Sonnet</text>
    <rect x="950" y="196" width="250" height="170" rx="24" fill="#fffaf2" stroke="#d8bc95"/>
    <text x="990" y="246" font-size="20" font-weight="900" fill="#6a5847">trigger</text>
    <text x="990" y="310" font-size="38" font-weight="900" fill="#211914">label</text>
  </g>
  <rect x="144" y="468" width="992" height="78" rx="22" fill="#1f1f1f"/>
  <text x="640" y="517" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="900" fill="#fff">Si no hay limite por PR, no hay piloto: hay experimento contable.</text>
</svg>
