<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Contrato JSON de review PR</title>
  <desc id="desc">Visual de comentario PR con salida JSON estructurada de findings.</desc>
  <rect width="1280" height="720" rx="36" fill="#f7efe5"/>
  <text x="72" y="84" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#211914">PR review contract</text>
  <text x="72" y="122" font-family="Inter, Arial, sans-serif" font-size="21" fill="#6a5847">Si Claude comenta PRs, la salida debe poder parsearse, filtrarse y auditarse.</text>
  <rect x="90" y="178" width="1100" height="438" rx="26" fill="#1f1f1f"/>
  <g font-family="Geist Mono, Consolas, monospace" font-size="20">
    <text x="132" y="232" fill="#d9f99d">{</text>
    <text x="166" y="274" fill="#bfdbfe">"summary": "Auth change is small but missing edge test",</text>
    <text x="166" y="316" fill="#bfdbfe">"findings": [</text>
    <text x="204" y="358" fill="#fecaca">{ "severity": "medium", "file": "src/auth.ts",</text>
    <text x="242" y="400" fill="#fecaca">"line": 42, "risk": "email trim not covered" }</text>
    <text x="166" y="442" fill="#bfdbfe">],</text>
    <text x="166" y="484" fill="#bfdbfe">"checks": ["pnpm test -- auth"],</text>
    <text x="166" y="526" fill="#bfdbfe">"decision": "changes_requested"</text>
    <text x="132" y="568" fill="#d9f99d">}</text>
  </g>
  <text x="640" y="666" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#211914">Texto libre para humanos. JSON estable para sistemas.</text>
</svg>
