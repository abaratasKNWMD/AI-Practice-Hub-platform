<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Action pipeline</title>
  <desc id="desc">Pipeline from PR label to Claude review comment.</desc>
  <rect width="1100" height="620" rx="34" fill="#0b0a09"/>
  <text x="95" y="112" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7f0">GitHub Action</text>
  <g transform="translate(115 245)" font-family="Inter, Arial, sans-serif">
    <path d="M160 72H725" stroke="#75e6c0" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 14"/>
    <rect width="160" height="145" rx="22" fill="#211713" stroke="#ff9aad" stroke-opacity="0.45"/>
    <text x="80" y="67" text-anchor="middle" font-size="19" font-weight="900" fill="#ffdfe5">PR label</text>
    <text x="80" y="96" text-anchor="middle" font-size="14" fill="#b9aea3">claude-review</text>
    <rect x="220" width="160" height="145" rx="22" fill="#171313" stroke="#ffd27a" stroke-opacity="0.45"/>
    <text x="300" y="67" text-anchor="middle" font-size="19" font-weight="900" fill="#ffe6ad">Read diff</text>
    <rect x="440" width="160" height="145" rx="22" fill="#111817" stroke="#75e6c0" stroke-opacity="0.45"/>
    <text x="520" y="67" text-anchor="middle" font-size="19" font-weight="900" fill="#c9fff0">Claude</text>
    <text x="520" y="96" text-anchor="middle" font-size="14" fill="#b9aea3">rubric</text>
    <rect x="660" width="190" height="145" rx="22" fill="#101418" stroke="#7bd7ff" stroke-opacity="0.45"/>
    <text x="755" y="67" text-anchor="middle" font-size="19" font-weight="900" fill="#d8f4ff">PR comment</text>
    <text x="755" y="96" text-anchor="middle" font-size="14" fill="#b9aea3">findings</text>
  </g>
</svg>
